 y="739.0" font-size="13" font-weight="normal" text-anchor="end" fill="#AFBCD2">(2, 2)</text><text class="island-title" x="1098.0" y="768.0" font-size="20" font-weight="bold" text-anchor="start" fill="#F5F3FA">Sky Threshold</text><text class="island-subtitle" x="1098.0" y="793.0" font-size="14" font-weight="normal" text-anchor="start" fill="#AFBCD2">Circular sky portal surrounded by fine</text><text class="island-subtitle" x="1098.0" y="812.0" font-size="14" font-weight="normal" text-anchor="start" fill="#AFBCD2">channels</text><text class="tap-hint" x="1098.0" y="833.0" font-size="12" font-weight="normal" text-anchor="start" fill="#AFBCD2">Select island for routes and inhabitants</text></g><line x1="56" x2="1404" y1="897" y2="897" stroke="#42516D"/><text class="" x="56" y="930" font-size="16" font-weight="bold" text-anchor="start" fill="#F593D3">READING THIS MAP</text><text class="" x="56" y="959" font-size="16" font-weight="normal" text-anchor="start" fill="#AFBCD2">Solid = shared route    /    Dashed = cat-only passage    /    Arrows end at the actual destination card</text><text class="" x="56" y="988" font-size="16" font-weight="normal" text-anchor="start" fill="#AFBCD2">A line crossing is never an island or a junction. Off-floor transport is listed in the connection diagram and atlas.</text><text class="" x="56" y="1017" font-size="14" font-weight="normal" text-anchor="start" fill="#AFBCD2">This is a design schematic, not finished game artwork or metre-level navigation geometry.</text></g></svg>