  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <script>
    // Boot guard: if a game file fails to load (for example index.html was opened from
    // inside the ZIP without extracting it) or start-up throws, explain what happened
    // instead of leaving the loading text up forever. Inline styles on purpose: the
    // stylesheet may be one of the missing files.
    (function () {
      var missing = [], firstError = '';
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && t.rel === 'stylesheet'))) missing.push(t.getAttribute('src') || t.getAttribute('href'));
        else if (e instanceof ErrorEvent && !firstError) firstError = e.message || String(e.error);
      }, true);
      window.addEventListener('load', function () {
        setTimeout(function () {
          var boot = document.getElementById('boot');
          if (!boot) return; // the game started and removed its loading text
          var p = function (html) { return '<p style="margin:0 0 14px">' + html + '</p>'; };
          var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
          var body = missing.length
            ? p('ALIEN STRIKE could not find its game files (' + missing.length + ' missing, for example <code>' + esc(missing[0]) + '</code>).') +
              p('If you opened <b>index.html</b> straight from the downloaded ZIP, extract the ZIP first (right-click it, <b>Extract All</b>), then open the extracted <b>alien-strike</b> folder and double-click <b>index.html</b> there.') +
              p('Keep the whole <b>alien-strike</b> folder together: index.html needs the src, data, levels, UI, assets and audio folders next to it.')
            : p('ALIEN STRIKE failed to start: <code>' + esc(firstError || 'start-up did not finish') + '</code>') +
              p('Try a current version of Chrome, Edge or Firefox. If it keeps happening, please report the message above.');
          boot.setAttribute('style', 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05080c;color:#cfe8f0;font:16px/1.5 system-ui,sans-serif;letter-spacing:0;padding:24px;z-index:100');
          boot.innerHTML = '<div style="max-width:640px"><h1 style="margin:0 0 16px;font:700 24px system-ui,sans-serif;letter-spacing:3px;color:#ffc35a">ALIEN STRIKE</h1>' + body + '</div>';
        }, 1500);
      });
    })();
  </script>
  <link rel="stylesheet" href="UI/style.css" />
</head>
