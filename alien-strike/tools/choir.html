<!doctype html><html><head><meta charset="utf-8"><title>Choir units preview</title>
<style>body{background:#1d1a17;margin:0;color:#eee;font:13px monospace}</style></head><body>
<canvas id="c" width="1600" height="980"></canvas>
<script src="../src/core/util.js"></script>
<script src="../data/worlds.js"></script>
<script src="../src/gfx/forge.js"></script>
<script src="../src/gfx/models.js"></script>
<script src="../src/gfx/models2.js"></script>
<script src="../src/gfx/models3.js"></script>
<script src="../src/gfx/models4.js"></script>
<script src="../src/gfx/models_choir.js"></script>
<script>
// Choir unit preview. Query: ?m=chThrall,chSentry,chShardback&w=1   (w = world id for ground + palette)
// Each row: large view (two headings, with the in-game gun sheet composited), game scale
// (~1.8 px/unit) at 8 headings, then the animation frames.
const Q = new URLSearchParams(location.search);
const W = AS.Data.worlds.find((w) => w.id === +(Q.get('w') || 1));
const GROUND = { 1: '#a87444', 2: '#a8442a', 8: '#5a8a5a', 10: '#bfb39c' }[W.id] || '#888';
const SERAPH = { a: '#b8ae9a', b: '#e6dcc6', t: '#5a4f7a', g: '#c09aff', d: '#3a3446' };
const CFG = {
  chThrall: { anims: 4, big: 4 },
  chSentry: { anims: 4, alt: 34, big: 4 },
  chShardback: { gun: { kind: 'cannon' }, gunZ: 7.6, big: 3.4 },
  chNeedler: { gun: { kind: 'missile' }, gunZ: 7.6, big: 3.4 },
  chOverseer: { gun: { kind: 'twin', size: 1.3 }, gunZ: 9.6, anims: 4, big: 2.6 },
  chStormInt: { alt: 44, big: 3.2 },
  chGunship: { alt: 50, big: 2.4, anims: 4 },
  chLancer: { gun: { kind: 'beam' }, gunZ: 8.2, big: 3 },
  chTitan: { anims: 4, big: 2.2 },
  chSeraph: { alt: 46, pal: SERAPH, big: 3, anims: 4 },
};
const c = document.getElementById('c').getContext('2d');
c.fillStyle = GROUND; c.fillRect(0, 0, 1600, 980);
for (let i = 0; i < 6000; i++) { c.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.07)'; c.fillRect(Math.random() * 1600, Math.random() * 980, 3, 3); }
const F = AS.Forge, M = AS.Models;
function put(sh, ang, an, x, y, sc, z, gun, gunZ, gang) {
  z = z || 0;
  const di = F.frameIndex(sh, ang);
  const off = 2 + z * 0.12;
  c.globalAlpha = .38; c.drawImage(sh.shadows[di], x - sh.ax * sc + (off + z * 0.15) * sc, y - sh.ay * sc + off * 0.5 * sc, sh.w * sc, sh.h * sc); c.globalAlpha = 1;
  const img = sh.frames[an % sh.anims][di];
  c.drawImage(img, x - sh.ax * sc, y - (sh.ay + z) * sc, sh.w * sc, sh.h * sc);
  if (gun) { const gi = F.frameIndex(gun, gang === undefined ? ang : gang); c.drawImage(gun.frames[0][gi], x - gun.ax * sc, y - (gun.ay + z + gunZ) * sc, gun.w * sc, gun.h * sc); }
}
const list = (Q.get('m') || 'chThrall,chSentry,chShardback').split(',');
const rowH = Math.floor(960 / list.length);
const errs = [];
list.forEach((name, ri) => {
  const cfg = CFG[name] || {};
  const pal = cfg.pal || W.choir;
  const y0 = ri * rowH;
  try {
    const t0 = performance.now();
    const sh = F.sheet(name + ri, () => M[name](pal, cfg.opt || {}), cfg.dirs || 24, cfg.anims || 1);
    const ms = performance.now() - t0;
    const gun = cfg.gun ? F.sheet('gun' + ri, () => M.gun(pal, cfg.gun), 24, 1) : null;
    const z = cfg.alt ? cfg.alt * 0.35 : 0; // compress altitude so rows fit
    const big = cfg.big || 3;
    const by = y0 + rowH * 0.62;
    put(sh, -0.6, 0, 150, by + z * big * 0.3, big, z * 0.3, gun, cfg.gunZ, -0.2);
    put(sh, 2.3, 1, 420, by + z * big * 0.3, big, z * 0.3, gun, cfg.gunZ, 1.6);
    const angs = [0, 0.8, 1.6, 2.4, 3.2, 4.0, 4.8, 5.6];
    angs.forEach((a, i) => put(sh, a, 0, 640 + (i % 4) * 92, y0 + rowH * (i < 4 ? 0.42 : 0.86), 1.8, z * 0.4, gun, cfg.gunZ));
    if (sh.anims > 1) for (let a = 0; a < sh.anims; a++) put(sh, 1.2, a, 1060 + a * 135, by, 2.3, 0);
    else put(sh, Math.PI / 2, 0, 1180, by, 2.6, 0, gun, cfg.gunZ, Math.PI / 2);
    const mem = sh.frames.length * sh.frames[0].length * sh.frames[0][0].width * sh.frames[0][0].height * 4 / 1048576;
    c.fillStyle = '#000'; c.fillText(name + '  parts ' + sh.model.parts.length + '  r ' + sh.model.r + ' h ' + sh.model.h + '  ' + ms.toFixed(0) + 'ms  ' + mem.toFixed(1) + 'MB', 12, y0 + 16);
  } catch (e) { errs.push(name + ': ' + e.message); c.fillStyle = '#f00'; c.fillText(name + ' ERROR ' + e.message, 12, y0 + 16); console.error(e); }
});
c.fillStyle = '#000'; c.fillText('World ' + W.id + ' ground ' + GROUND + '   (row: 2 large views · 8 headings at 1.8x · anim frames)', 12, 975);
window.__errs = errs;
</script></body></html>
