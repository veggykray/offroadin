<!doctype html><html><head><meta charset="utf-8"><style>body{background:#1d1a17;margin:0}canvas{image-rendering:pixelated}</style></head><body>
<canvas id="c" width="720" height="405" style="width:1440px;height:810px"></canvas>
<script src="../src/core/util.js"></script>
<script src="../src/gfx/forge.js"></script>
<script src="../src/gfx/models.js"></script>
<script src="../src/gfx/models2.js"></script>
<script src="../src/gfx/models3.js"></script>
<script src="../src/gfx/models4.js"></script>
<script>
const c=document.getElementById('c').getContext('2d');c.imageSmoothingEnabled=false;
c.fillStyle='#8a6a44';c.fillRect(0,0,720,405);
for(let i=0;i<9000;i++){c.fillStyle=Math.random()<.5?'#7d5f3c':'#977650';c.fillRect(Math.random()*720|0,Math.random()*405|0,1,1);}
const M=AS.Models, F=AS.Forge;
const choir={a:'#a59e8c',b:'#d8d0bc',t:'#5a4f7a',g:'#b07cff',d:'#34303e'};
const beast={a:'#7a4a2e',b:'#b0754a',t:'#e8c890',g:'#ffcf4a',d:'#3a2214'};
const colony={a:'#7d8288',b:'#b9bec4',t:'#d08a2a',g:'#7fe8ff',d:'#33363a'};
let x=30,y=60;
function put(key,fn,ang,anim,dirs,anims){const sh=F.sheet(key,fn,dirs||16,anims||1);const di=F.frameIndex(sh,ang||0);c.globalAlpha=.3;c.drawImage(sh.shadows[di],x-sh.ax+3,y-sh.ay+2);c.globalAlpha=1;c.drawImage(sh.frames[anim||0][di],x-sh.ax,y-sh.ay);x+=Math.max(30,sh.w*0.8+6);if(x>680){x=30;y+=70;}}
put('craft',()=>M.craft({}),-0.5,0,32);
put('craft2',()=>M.craft({armor:4,speed:3,scanner:2,fuelCap:2,shield:3}),-0.5,0,32);
put('tank',()=>M.hovertank(choir,{style:'shard'}),0.6);
put('gun',()=>M.gun(choir,{kind:'cannon'}),0.6);
put('tank2',()=>M.hovertank(colony,{style:'slab'}),2.2);
put('walker',()=>M.walker(choir,{legs:2,channels:1}),0.3,1,16,4);
put('walker4',()=>M.walker({a:'#5a6a4a',b:'#8a9a6a'},{legs:4}),2.3,2,16,4);
put('art',()=>M.tracked(colony,{}),0.5);
put('haul',()=>M.hauler(colony,{}),-0.3);
put('bike',()=>M.bike({a:'#8a3a2a',b:'#c45a3a'}),1.0);
put('boat',()=>M.boat(colony),0.9);
put('drone',()=>M.drone(choir),0.2);
put('inter',()=>M.interceptor(choir),0.8);
put('gunship',()=>M.gunship(choir),2.8);
put('sent',()=>M.sentinel({a:'#6a6458',b:'#a89c84',g:'#ff6a3a'}),0);
put('golem',()=>M.golem({a:'#2a2624',b:'#4a4440',g:'#ff7a2a'}),0.4,0,16,4);
put('quad',()=>M.quad(beast,{spikes:1,jaws:1}),0.4,1,16,4);
put('insect',()=>M.insect({a:'#3a5a2a',b:'#6a9a3a',g:'#e0ff6a'},{wings:1,len:9}),2,1,16,4);
put('worm',()=>M.worm(beast,{segs:4,plates:1}),0.2,0,16,4);
put('ray',()=>M.ray({a:'#3a4a7a',b:'#6a8ac0',g:'#9ff'}),0.5,1,16,4);
put('crys',()=>M.crystal({a:'#6a8aa8',b:'#bfe4ff',t:'#e0f4ff',g:'#7ff'}),2.1,0,16,4);
put('fung',()=>M.fungal({a:'#6a5a8a',b:'#a090c0',t:'#c0306a',g:'#7fffd0'}),0,0,16,4);
put('lurk',()=>M.lurker({a:'#3a6a2a',b:'#6aa040',d:'#2a1a1a',g:'#ff4a6a'}),0,2,1,4);
put('amph',()=>M.amphibian({a:'#2a6a6a',b:'#4aa0a0',t:'#e0a040',g:'#ffef6a'}),0.6,0,16,4);
put('puff',()=>M.puff({a:'#8a5a9a',b:'#d0a0e0',g:'#fff0a0'}),0,0,1,4);
x=30;y+=90;
const S1=(k,fn,an)=>{const sh=F.sheet(k,fn,1,an||1);c.drawImage(sh.frames[0][0],x-sh.ax,y-sh.ay);x+=sh.w*0.85+4;if(x>680){x=30;y+=85;}};
S1('tb',()=>M.turretBase(choir,{style:'needle'}));
S1('radar',()=>M.radar(colony),8);
S1('comms',()=>M.comms(choir),2);
S1('sg',()=>M.shieldgen(choir));
S1('pow',()=>M.power(choir));
S1('fac',()=>M.factory(choir));
S1('bar',()=>M.barracks(colony));
S1('nest',()=>M.nest(beast));
S1('spore',()=>M.sporeTower({a:'#5a3a5a',b:'#8a5a7a',t:'#c08ab0',g:'#d0ff6a',d:'#2a1a2a'}));
S1('pods',()=>M.pods({a:'#5a7a2a',b:'#8ab04a',g:'#ffef7a'}));
S1('station',()=>M.station(colony));
S1('spire',()=>M.spire({a:'#3a3236',b:'#5a4e52',t:'#6a5e62'},{h:90}));
S1('wreck',()=>M.wreckShip(colony));
S1('derrick',()=>M.derrick(colony),4);
S1('tanks',()=>M.tanks(colony));
S1('obel',()=>M.obelisk(choir));
document.title='done';
</script></body></html>
