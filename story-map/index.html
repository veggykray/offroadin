<title>The Long Way Home</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1422">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Long Way Home">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#0b1422;
  --panel:#0f1b2c;
  --panel-2:#1a2c44;
  --line:#2a3f5c;
  --ink:#e9eef8;
  --ink-2:#aebbd2;
  --ink-3:#7485a3;
  --gold:#f5c451;
  --choice:#ff5d7a;
  --focus:#9fd0ff;
  --display:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;background:var(--night);color:var(--ink)}
body{margin:0;font:15px/1.4 var(--body);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}

/* ---------- Header ---------- */
.masthead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;padding:12px 16px 4px}
.bare{background:transparent;border:1px solid transparent;border-radius:6px;padding:1px 6px;margin:0 -6px;min-width:0}
.bare:hover{border-color:var(--line)}
.bare:focus{border-color:var(--focus);outline:none;background:rgba(255,255,255,.03)}
#m-title{font:600 clamp(22px,3vw,34px)/1.1 var(--display);letter-spacing:.06em;text-transform:uppercase;width:min(560px,100%)}
#m-subtitle{font:600 clamp(13px,1.4vw,16px)/1.2 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2);width:min(420px,100%)}
.stats{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.03em;margin-left:auto}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:6px 16px 10px;padding:7px 10px;background:rgba(15,27,44,.95);border:1px solid var(--line);border-radius:10px}
.tgroup{display:flex;gap:4px;align-items:center}
.tlabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:14px;line-height:1.2;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:#3d5a80;background:#203652}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:#2a4a70;border-color:#4d77a8}
.btn.big{font-size:15px;padding:7px 14px}
.btn.danger{border-color:#6b2a3a;color:#ffb3c0}
.btn[aria-pressed="true"]{background:#2a4a70;border-color:#4d77a8}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;font-size:14px;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:#24405f;color:var(--ink)}
.linesample{width:26px;height:8px;display:inline-block}
.status{margin-left:auto;font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.status[data-s="saved"] i{background:#5ed49b}
.status[data-s="saving"] i{background:var(--gold)}
.status[data-s="local"] i{background:#6aa8ff}
.status[data-s="error"] i{background:var(--choice)}

/* ---------- Canvas ---------- */
.stage{position:relative;margin:0 16px 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:
    radial-gradient(900px 500px at 50% 0%, #182c46 0%, transparent 70%),
    radial-gradient(circle, rgba(160,190,230,.10) 1px, transparent 1.2px) 0 0/28px 28px,
    #0a1320;}
#viewport{position:absolute;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
svg#edges{position:absolute;overflow:visible;pointer-events:none}
.lk .vis{fill:none;stroke-width:2.2;stroke-linecap:round}
.lk .hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.lk:hover .vis,.lk.sel .vis{stroke-width:3.6}
.lk.sel .vis{filter:drop-shadow(0 0 5px currentColor)}
.lk.dim{opacity:.12}
.lk text{font:600 12px var(--body);paint-order:stroke;stroke:#0a1320;stroke-width:4px;stroke-linejoin:round}
.tmp{fill:none;stroke:var(--gold);stroke-width:2.5;stroke-dasharray:5 5}
.threadpath{fill:none;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;opacity:.22}

.node{--c:#63b3ff;position:absolute;width:230px;height:64px;display:grid;grid-template-columns:34px 28px minmax(0,1fr) auto;align-items:center;border-radius:9px;
  background:color-mix(in srgb,var(--c) 22%,#0f1a2b);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);cursor:move;
  box-shadow:0 0 18px color-mix(in srgb,var(--c) 14%,transparent);transition:opacity .15s,box-shadow .15s}
.node:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 80%,#fff),0 0 16px color-mix(in srgb,var(--c) 40%,transparent)}
.node.sel{box-shadow:0 0 0 2.5px #fff,0 0 22px color-mix(in srgb,var(--c) 70%,transparent)}
.node.dragging{opacity:.85;z-index:4;box-shadow:0 0 0 2.5px #fff,0 12px 30px rgba(0,0,0,.55)}
.node.choice{--c:var(--choice)}
.node.dim{opacity:.25}
.node.member{box-shadow:0 0 0 3px var(--tc),0 0 18px color-mix(in srgb,var(--tc) 60%,transparent)}
.node.droptarget{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(245,196,81,.55)}
.num{align-self:stretch;display:grid;place-items:center;font:700 15px var(--body);font-variant-numeric:tabular-nums;border-radius:8px 0 0 8px;background:color-mix(in srgb,var(--c) 45%,#e9eef8 25%);color:#0b1422}
.glyph{display:grid;place-items:center;align-self:stretch;background:rgba(0,0,0,.18)}
.glyph svg{width:18px;height:18px}
.body{padding:6px 8px;min-width:0}
.t{display:block;font-weight:700;font-size:15px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.empty{font-weight:400;font-style:italic;color:var(--ink-3)}
.d{display:block;font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.extras{display:flex;gap:3px;align-items:center;padding-right:14px}
.extras svg{width:12px;height:12px}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.handle{position:absolute;right:-12px;top:50%;margin-top:-12px;width:24px;height:24px;border-radius:50%;background:#0b1422;border:2px solid color-mix(in srgb,var(--c) 70%,#fff);
  opacity:0;cursor:crosshair;touch-action:none;transition:opacity .12s;z-index:3;padding:0}
.handle::after{content:"";position:absolute;inset:6px;border-radius:50%;background:color-mix(in srgb,var(--c) 70%,#fff)}
.node:hover .handle,.node.sel .handle{opacity:1}
.selbox{position:absolute;border:1.5px dashed var(--focus);background:rgba(159,208,255,.08);pointer-events:none;z-index:6}

/* floating bar over the selected scene(s) */
.nodebar{position:absolute;z-index:7;display:flex;gap:4px;padding:4px;background:#0f1b2cf2;border:1px solid #3d5a80;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.45);transform:translate(-50%,-100%);white-space:nowrap}
.nodebar button{background:transparent;border:0;border-radius:7px;padding:6px 10px;font-size:14px;color:var(--ink);display:inline-flex;gap:5px;align-items:center}
.nodebar button:hover{background:#203652}
.nodebar button.del{color:#ffb3c0}
.nodebar button.del:hover{background:#4a1f2b}
.nodebar .count{padding:6px 8px;font-size:13px;color:var(--ink-3)}

/* zoom controls + legend + toast */
.zoombar{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;align-items:center;background:rgba(15,27,44,.92);border:1px solid var(--line);border-radius:9px;padding:4px;z-index:5}
.zoombar button{background:transparent;border:0;border-radius:6px;min-width:32px;height:32px;font-size:18px;color:var(--ink)}
.zoombar button:hover{background:#203652}
.zoombar .pct{font-size:13px;min-width:48px;text-align:center;color:var(--ink-2);font-variant-numeric:tabular-nums}
.zoombar .fit{font-size:13px;padding:0 10px}
.legend{position:absolute;left:12px;bottom:12px;z-index:5;background:rgba(15,27,44,.92);border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:13px;color:var(--ink-2);max-width:calc(100% - 250px)}
.legend summary{cursor:pointer;font:600 12px var(--display);letter-spacing:.14em;text-transform:uppercase;color:#bfe3ff}
.legend ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px}
.legend li{display:flex;gap:8px;align-items:center}
.legend svg{width:16px;height:16px;flex:none}
.legend .ln{width:34px;height:10px}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:8;display:flex;gap:12px;align-items:center;padding:7px 8px 7px 14px;border-radius:9px;border:1px solid var(--tc,#4fc8f0);background:#0f1b2cf0;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:calc(100% - 24px)}
.banner b{color:var(--tc)}
.toast{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:9;display:flex;gap:10px;align-items:center;padding:7px 8px 7px 14px;border-radius:9px;background:#1a2c44;border:1px solid #3d5a80;box-shadow:0 8px 24px rgba(0,0,0,.45);white-space:nowrap}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:4;font-size:13px;color:var(--ink-3);background:rgba(10,19,32,.85);padding:4px 10px;border-radius:7px;pointer-events:none;white-space:nowrap}
@media (max-width:1000px){.hint{display:none}}

/* ---------- Side panels ---------- */
.panel{position:fixed;top:0;bottom:0;width:min(380px,100%);z-index:50;background:var(--panel);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 0 40px rgba(0,0,0,.45)}
#panel{right:0;border-left:1px solid var(--line)}
#bible{left:0;border-right:1px solid var(--line)}
.panel header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel p{margin:0;line-height:1.5}
.step{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.step>b{width:26px;height:26px;border-radius:50%;background:#2a4a70;display:grid;place-items:center;font-size:14px}
.step>div{display:grid;gap:4px}
.panel code{background:#0b1422;padding:0 4px;border-radius:4px}
a.btn{text-decoration:none;color:inherit}
.panel header .pnum{font:700 18px var(--body);min-width:38px;height:38px;padding:0 6px;display:grid;place-items:center;border-radius:8px;background:var(--pc,#63b3ff);color:#0b1422;font-variant-numeric:tabular-nums}
.panel header h3{margin:0;font:600 15px var(--display);letter-spacing:.1em;text-transform:uppercase;flex:1}
.panel header h3 small{display:block;font:400 13px var(--body);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.pbody{overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.flabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.inp{background:#0b1422;border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
.inp:focus{border-color:var(--focus);outline:none}
textarea.inp{min-height:110px;resize:vertical;line-height:1.45}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;cursor:pointer;user-select:none}
.chk input{margin:0;accent-color:var(--gold)}
.chip{border:1px solid var(--tc);border-radius:999px;padding:3px 10px;font-size:13px;background:transparent;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--tc)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--tc) 25%,transparent);color:var(--ink)}
.chip[aria-pressed="true"] i{background:var(--tc)}
.links-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.links-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:7px}
.go{border:0;background:none;padding:0;text-align:left;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go:hover{text-decoration:underline}
.pill{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 7px;border:1px solid currentColor;background:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3);font-size:13px}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;background:var(--sw)}
.colors button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--panel) inset}
.divider{border:0;border-top:1px solid var(--line);margin:2px 0}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 8px;font-size:13px;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);border-color:#3d5a80}
.icon-btn[aria-pressed="true"]{background:var(--tc);color:#0b1422;border-color:var(--tc)}
.shape{font:600 15px var(--body);font-variant-numeric:tabular-nums;color:var(--gold);letter-spacing:.02em}
.tabs{display:flex;gap:4px;padding:10px 16px 0}
.tabs button{border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:transparent;padding:6px 12px;color:var(--ink-2);font:600 12px var(--display);letter-spacing:.12em;text-transform:uppercase}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--ink)}
.thread{border:1px solid var(--line);border-radius:9px;padding:10px;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.15)}
.thread.active{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc)}
.tname{display:flex;align-items:center;gap:8px}
.swatch{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 30%,transparent);padding:0}
.tname input{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--tc);flex:1}
.nums{display:flex;flex-wrap:wrap;gap:4px}
.nums button{border:1.5px solid var(--tc);background:transparent;border-radius:999px;min-width:28px;padding:1px 7px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.nums button:hover{background:var(--tc);color:#0b1422}
#notes{min-height:320px}

@media (max-width:720px){
  .stats{margin-left:0;width:100%}
  .status{margin-left:0}
  #panel,#bible{top:auto;height:70vh;width:100%;border:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0}
  .legend{display:none}
  .stage{margin:0 8px 8px}
  .handle{opacity:.9}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="masthead">
    <input class="bare" id="m-title" aria-label="Map title" spellcheck="false">
    <input class="bare" id="m-subtitle" aria-label="Map subtitle" spellcheck="false">
    <span class="stats" id="stats"></span>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Map tools">
    <div class="tgroup">
      <button class="btn primary big" id="addScene" title="Add a scene in the middle of the screen (or double-click empty space)">＋ Add scene</button>
    </div>
    <div class="tgroup">
      <button class="btn" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button class="btn" id="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    </div>
    <div class="tgroup">
      <span class="tlabel">New links</span>
      <div class="seg" id="kindSeg"></div>
    </div>
    <div class="tgroup">
      <button class="btn" id="bibleBtn" aria-pressed="false">☰ Threads &amp; notes</button>
      <button class="btn" id="newMap">✦ New map…</button>
      <button class="btn" id="recoverBtn" title="Find maps and backups saved on this device">⟲ Recover</button>
      <button class="btn" id="export">Export</button>
      <label class="btn" for="importFile" style="cursor:pointer">Import</label>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
    <div class="status" id="status" data-s="local"><i></i><span>Loading…</span></div>
    <button class="btn" id="syncBtn" hidden>☁ Sync devices</button>
  </div>

  <div class="stage" id="stage">
    <div id="viewport"><div id="world"></div></div>
    <div class="hint" id="hint">Drag scenes to move them · double-click empty space to add one · drag a scene's ● onto another to link · scroll to zoom</div>
    <div id="bannerSlot"></div>
    <div class="nodebar" id="nodebar" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <details class="legend">
      <summary>Key &amp; tips</summary>
      <ul id="legend"></ul>
    </details>
    <div class="zoombar">
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <span class="pct" id="zoomPct">100%</span>
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button class="fit" id="zoomFit" title="Show the whole map (0)">Whole map</button>
    </div>
  </div>
</div>

<aside class="panel" id="bible" hidden aria-label="Threads and notes">
  <header><h3>Story bible<small>Threads that recur, and your notes</small></h3><button class="icon-btn" id="bibleClose" aria-label="Close">✕</button></header>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="threads" aria-selected="true">Threads</button>
    <button role="tab" data-tab="notes" aria-selected="false">Notes</button>
  </div>
  <div class="pbody" id="tab-threads"></div>
  <div class="pbody" id="tab-notes" hidden><textarea class="inp" id="notes" aria-label="Notes" placeholder="Design notes, open questions, ideas…"></textarea></div>
</aside>

<aside class="panel" id="panel" hidden aria-label="Editor"></aside>

<script>
(() => {
"use strict";

/* ================= constants ================= */
// colour runs from the first column to the last: blue → teal → green → gold → violet → rose
const RAMP = ["#63b3ff","#4fd3d6","#5ed49b","#f4c04c","#b48cff","#ff7f9a"];
const LINK_COLORS = ["#e6ebf5","#f5c451","#ff6fa8","#4fd6e0","#6aa8ff","#8fe07a","#b48cff"];
const THREAD_COLORS = ["#c3e05a","#ff6f8e","#4fc8f0","#b98bff","#f5c451","#6ee0b0","#ff9a5a"];
const KINDS = {
  main:        {label:"Main path",   dash:"",    color:"#e6ebf5", desc:"The usual way through."},
  conditional: {label:"Conditional", dash:"7 5", color:"#f5c451", desc:"Needs an item or earlier choice."},
  optional:    {label:"Optional",    dash:"2 5", color:"#4fd6e0", desc:"Secret or side route."},
};
const W = 230, H = 64, COL = 320, ROW = 88, SNAP = 10;
const ICON = {
  star:    () => `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#f5c451" d="M12 2.4l2.9 6.2 6.7.8-5 4.6 1.4 6.6L12 17.3l-6 3.3 1.4-6.6-5-4.6 6.7-.8z"/></svg>`,
  diamond: () => `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff5d7a" d="M12 2.5 20 12l-8 9.5L4 12z"/></svg>`,
  paw:     () => `<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="#6fc3ff"><ellipse cx="12" cy="16" rx="5" ry="4.2"/><circle cx="5.5" cy="10.5" r="2.2"/><circle cx="9.5" cy="6.5" r="2.2"/><circle cx="14.5" cy="6.5" r="2.2"/><circle cx="18.5" cy="10.5" r="2.2"/></g></svg>`,
  clue:    () => `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="#4fa9ff"/><circle cx="10" cy="10" r="2.4" fill="#d6ecff"/></svg>`,
};
const small = s => s.replace("<svg","<svg width='14' height='14'");
const LS_KEY = "long-way-home-v3:draft";

/* ================= map shape ================= */
function newScene(x=0,y=0){ return {title:"",desc:"",type:"normal",dog:false,clue:false,notes:"",x,y}; }
// Tier sizes: 1, then +step per tier for `grow` tiers, then back down the same way.
// step 3, grow 5 → 1 3 6 9 12 15 12 9 6 3 1
function tierSizes(step, grow){
  const up = [1]; for(let k=1;k<=grow;k++) up.push(k*step);
  return [...up, ...up.slice(0,-1).reverse()];
}
function shapedMap(step=3, grow=5, dir="across", base){
  const S = base ? {...base, nodes:{}, edges:[]} : {
    version:3, updatedAt:0, seq:0, dir,
    meta:{title:"The Long Way Home", subtitle:"Scene master map"},
    nodes:{}, edges:[], notes:"",
    threads:[["The Giant",0],["The Dog",1],["The Search",2],["Other motifs",3]].map(([name,c],i)=>({id:"t"+(i+1),name,color:THREAD_COLORS[c],scenes:[]})),
  };
  S.dir = dir; S.seq = S.seq||0;
  tierSizes(step,grow).forEach((n,i)=>{
    for(let j=0;j<n;j++){
      const off = (j-(n-1)/2);
      const [x,y] = dir==="down" ? [Math.round(off*(W+30)), i*(H+80)] : [i*COL, Math.round(off*ROW)];
      S.nodes["n"+(++S.seq)] = newScene(x - (dir==="down"?W/2:0), y - (dir==="down"?0:H/2));
    }
  });
  S.threads.forEach(t=>{ t.scenes=[]; t.note ??= ""; });
  return S;
}

/* ================= state ================= */
let S = shapedMap();
let L = null;
let undoStack = [], redoStack = [], lastMutAt = 0, lastMutKey = "";
let sel = null;                 // {kind:"scene",id} | {kind:"multi",ids} | {kind:"link",id} | {kind:"generate",...} | {kind:"sync"}
let panelOpen = false;          // scene editor shown for the selected scene
let hoverId = null, threadEdit = null, threadShow = null;
let newKind = "main";
const view = {k:1, tx:0, ty:0};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + (++S.seq);
const clone = o => JSON.parse(JSON.stringify(o));
const snap = v => Math.round(v/SNAP)*SNAP;

/* ================= derived: numbering + colours ================= */
function mix(a,b,t){ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const A=p(a),B=p(b); return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join(""); }
function rampColor(t){ const x=Math.max(0,Math.min(1,t))*(RAMP.length-1), i=Math.min(RAMP.length-2,Math.floor(x)); return mix(RAMP[i],RAMP[i+1],x-i); }
// Scenes are numbered in reading order: column by column (or row by row when the map flows down).
function derive(){
  const ids = Object.keys(S.nodes);
  const down = S.dir==="down";
  const major = id => down ? S.nodes[id].y : S.nodes[id].x;
  const minor = id => down ? S.nodes[id].x : S.nodes[id].y;
  const sorted = ids.slice().sort((a,b)=>major(a)-major(b));
  const bands = []; let cur=null, last=-Infinity;
  sorted.forEach(id=>{ const m=major(id); if(!cur || m-last > (down?H:W)/2){ cur=[]; bands.push(cur); } cur.push(id); last=m; });
  const num = {}, band = {}; let n=0;
  bands.forEach((b,bi)=>{ b.sort((a,c)=>minor(a)-minor(c)); b.forEach(id=>{ num[id]=++n; band[id]=bi; }); });
  const box = ids.length ? {
    x0:Math.min(...ids.map(id=>S.nodes[id].x)), y0:Math.min(...ids.map(id=>S.nodes[id].y)),
    x1:Math.max(...ids.map(id=>S.nodes[id].x+W)), y1:Math.max(...ids.map(id=>S.nodes[id].y+H)),
  } : {x0:0,y0:0,x1:W,y1:H};
  const color = {};
  ids.forEach(id=>color[id] = S.nodes[id].type==="choice" ? "#ff5d7a" : rampColor(bands.length>1 ? band[id]/(bands.length-1) : 0));
  return {num, band, bands, box, color};
}

/* ================= undo / change ================= */
function snapshot(){ undoStack.push(clone(S)); if(undoStack.length>200) undoStack.shift(); redoStack=[]; }
function mutate(fn, key){
  const now = Date.now();
  if(!key || key!==lastMutKey || now-lastMutAt>1200) snapshot();
  lastMutAt = now; lastMutKey = key||"";
  fn();
  S.updatedAt = now;
  changed(key);
}
function changed(key){
  renderMap(); renderStats(); syncHistoryBtns();
  if(!key){ renderPanel(); renderBible(); }
  persistLocal(true); scheduleSave();
}
function undo(){ if(!undoStack.length) return; redoStack.push(clone(S)); S=undoStack.pop(); lastMutKey=""; afterSwap(); }
function redo(){ if(!redoStack.length) return; undoStack.push(clone(S)); S=redoStack.pop(); lastMutKey=""; afterSwap(); }
function afterSwap(){
  S.updatedAt = Date.now();
  if(sel?.kind==="scene" && !S.nodes[sel.id]) sel=null;
  if(sel?.kind==="link" && !S.edges.find(e=>e.id===sel.id)) sel=null;
  if(sel?.kind==="multi"){ sel.ids = sel.ids.filter(id=>S.nodes[id]); if(!sel.ids.length) sel=null; }
  if(threadEdit && !S.threads.find(t=>t.id===threadEdit)) threadEdit=null;
  hideToast(); renderAll(); persistLocal(true); scheduleSave();
}
function syncHistoryBtns(){ $("#undo").disabled=!undoStack.length; $("#redo").disabled=!redoStack.length; }

/* ================= render ================= */
function glyph(s){ return s.type==="major"?ICON.star():s.type==="choice"?ICON.diamond():s.dog?ICON.paw():s.clue?ICON.clue():""; }
function selectedIds(){ return sel?.kind==="scene" ? [sel.id] : sel?.kind==="multi" ? sel.ids : []; }

function renderMeta(){
  for(const k of ["title","subtitle"]){ const el=$("#m-"+k); if(document.activeElement!==el) el.value=S.meta[k]||""; }
  if(document.activeElement!==$("#notes")) $("#notes").value=S.notes||"";
  document.title = S.meta.title || "Story map";
}
function renderStats(){
  const v = Object.values(S.nodes);
  $("#stats").textContent = `${v.length} scenes · ${L.bands.length} ${S.dir==="down"?"rows":"columns"} (${L.bands.map(b=>b.length).join("·")}) · ${S.edges.length} links`;
}
function nodeHTML(id){
  const s = S.nodes[id];
  const te = threadEdit && S.threads.find(t=>t.id===threadEdit);
  const ts = !te && threadShow && S.threads.find(t=>t.id===threadShow);
  const focus = te || ts;
  const extras = [];
  if(s.dog && s.type!=="normal") extras.push(ICON.paw());
  if(s.clue && (s.type!=="normal"||s.dog)) extras.push(ICON.clue());
  S.threads.filter(t=>t.scenes.includes(id)).forEach(t=>extras.push(`<span class="tdot" style="--tc:${t.color}" title="${esc(t.name)}"></span>`));
  let cls = "node";
  if(s.type==="choice") cls+=" choice";
  if(selectedIds().includes(id)) cls+=" sel";
  if(focus) cls += focus.scenes.includes(id) ? " member" : " dim";
  return `<div class="${cls}" data-id="${id}" tabindex="0" style="left:${s.x}px;top:${s.y}px;--c:${L.color[id]};${focus?`--tc:${focus.color}`:""}" aria-label="Scene ${L.num[id]}${s.title?": "+esc(s.title):""}">
    <span class="num">${L.num[id]}</span><span class="glyph">${glyph(s)}</span>
    <span class="body"><span class="t${s.title?"":" empty"}">${s.title?esc(s.title):"Untitled scene"}</span>${s.desc?`<span class="d">${esc(s.desc)}</span>`:""}</span>
    <span class="extras">${extras.join("")}</span>
    <button class="handle" data-handle="${id}" title="Drag onto another scene to link them" aria-label="Link from scene ${L.num[id]}"></button>
  </div>`;
}
function renderMap(){
  L = derive();
  let h = "";
  for(const id in S.nodes) h += nodeHTML(id);
  h += `<svg id="edges"></svg><div class="selbox" id="selbox" hidden></div>`;
  $("#world").innerHTML = h;
  renderEdges(); renderNodebar();
}

// Connect the facing sides of two scenes, whatever direction they sit in.
function anchors(a,b){
  const acx=a.x+W/2, acy=a.y+H/2, bcx=b.x+W/2, bcy=b.y+H/2, dx=bcx-acx, dy=bcy-acy;
  if(Math.abs(dx) > W*0.75 || Math.abs(dx)/W > Math.abs(dy)/H){
    const r = dx>=0 ? 1 : -1;
    return {sx: r>0?a.x+W:a.x, sy: acy, ex: r>0?b.x-8:b.x+W+8, ey: bcy, h:true, r};
  }
  const r = dy>=0 ? 1 : -1;
  return {sx: acx, sy: r>0?a.y+H:a.y, ex: bcx, ey: r>0?b.y-8:b.y+H+8, h:false, r};
}
function edgePath(e){
  const a = S.nodes[e.from], b = S.nodes[e.to]; if(!a||!b) return null;
  const p = anchors(a,b);
  const d = p.h ? Math.max(40,Math.abs(p.ex-p.sx)*.5) : Math.max(30,Math.abs(p.ey-p.sy)*.5);
  const c1x = p.h ? p.sx+p.r*d : p.sx, c1y = p.h ? p.sy : p.sy+p.r*d;
  const c2x = p.h ? p.ex-p.r*d : p.ex, c2y = p.h ? p.ey : p.ey-p.r*d;
  const f = v=>v.toFixed(1);
  return {d:`M${f(p.sx)} ${f(p.sy)} C${f(c1x)} ${f(c1y)} ${f(c2x)} ${f(c2y)} ${f(p.ex)} ${f(p.ey)}`,
    mx:(p.sx+3*c1x+3*c2x+p.ex)/8, my:(p.sy+3*c1y+3*c2y+p.ey)/8};
}
function renderEdges(){
  const svg = $("#edges"); if(!svg) return;
  const ids = Object.keys(S.nodes);
  const b = ids.length ? {x0:Math.min(...ids.map(id=>S.nodes[id].x)), y0:Math.min(...ids.map(id=>S.nodes[id].y)), x1:Math.max(...ids.map(id=>S.nodes[id].x+W)), y1:Math.max(...ids.map(id=>S.nodes[id].y+H))} : L.box;
  const pad = 600, x0=b.x0-pad, y0=b.y0-pad, w=b.x1-b.x0+2*pad, hh=b.y1-b.y0+2*pad;
  Object.assign(svg.style,{left:x0+"px",top:y0+"px"});
  svg.setAttribute("width",w); svg.setAttribute("height",hh); svg.setAttribute("viewBox",`${x0} ${y0} ${w} ${hh}`);
  const te = threadEdit && S.threads.find(t=>t.id===threadEdit);
  const ts = !te && threadShow && S.threads.find(t=>t.id===threadShow);
  const focus = te || ts;
  const selIds = selectedIds();
  const markers = new Set([KINDS.main.color]);
  let paths = "";
  if(focus){
    const pts = focus.scenes.filter(id=>S.nodes[id]).sort((a,c)=>L.num[a]-L.num[c]).map(id=>[S.nodes[id].x+W/2, S.nodes[id].y+H/2]);
    if(pts.length>1) paths += `<path class="threadpath" stroke="${focus.color}" d="M${pts.map(p=>p.map(v=>v.toFixed(1)).join(" ")).join(" L")}"/>`;
  }
  const hot = hoverId || (selIds.length===1 ? selIds[0] : null);
  S.edges.forEach(e=>{
    const p = edgePath(e); if(!p) return;
    const color = e.color || KINDS[e.kind].color; markers.add(color);
    let cls = "lk";
    if(sel?.kind==="link" && sel.id===e.id) cls+=" sel";
    if(focus || (hot && e.from!==hot && e.to!==hot)) cls+=" dim";
    paths += `<g class="${cls}" data-link="${e.id}" style="color:${color}">
      <path class="vis" d="${p.d}" stroke="${color}" ${KINDS[e.kind].dash?`stroke-dasharray="${KINDS[e.kind].dash}"`:""} marker-end="url(#ah-${color.slice(1)})"/>
      <path class="hit" d="${p.d}"><title>${L.num[e.from]} → ${L.num[e.to]} · ${KINDS[e.kind].label}${e.label?" · "+esc(e.label):""}</title></path>
      ${e.label?`<text x="${p.mx.toFixed(1)}" y="${(p.my-6).toFixed(1)}" text-anchor="middle" fill="${color}">${esc(e.label)}</text>`:""}
    </g>`;
  });
  let defs = "<defs>";
  markers.forEach(c=>{ defs += `<marker id="ah-${c.slice(1)}" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`; });
  svg.innerHTML = defs + "</defs>" + paths + `<path class="tmp" id="tmpLine" d="" visibility="hidden"/>`;
}

/* floating action bar above the selection, drawn in screen space so it stays readable at any zoom */
function renderNodebar(){
  const bar = $("#nodebar");
  const ids = selectedIds().filter(id=>S.nodes[id]);
  if(!ids.length || drag || nodeDrag?.moved){ bar.hidden = true; return; }
  if(ids.length===1){
    bar.innerHTML = `<button data-bar="edit">✎ Edit</button><button data-bar="below" title="Add a scene underneath">＋ Below</button><button data-bar="right" title="Add a scene to the right">＋ Right</button><button data-bar="delete" class="del">🗑 Delete</button>`;
  } else {
    bar.innerHTML = `<span class="count">${ids.length} selected</span><button data-bar="col" title="Stack them in one tidy column">⇅ Line up</button><button data-bar="row" title="Put them in one tidy row">⇄ Line up</button><button data-bar="delete" class="del">🗑 Delete ${ids.length}</button>`;
  }
  bar.hidden = false;
  placeNodebar();
}
function placeNodebar(){
  const bar = $("#nodebar"); if(bar.hidden) return;
  const ids = selectedIds().filter(id=>S.nodes[id]); if(!ids.length) return;
  const x0 = Math.min(...ids.map(id=>S.nodes[id].x)), x1 = Math.max(...ids.map(id=>S.nodes[id].x+W)), y0 = Math.min(...ids.map(id=>S.nodes[id].y));
  const r = $("#stage").getBoundingClientRect();
  let x = ((x0+x1)/2)*view.k + view.tx, y = y0*view.k + view.ty - 10;
  x = Math.max(bar.offsetWidth/2+6, Math.min(r.width-bar.offsetWidth/2-6, x));
  y = Math.max(bar.offsetHeight+6, y);
  bar.style.left = x+"px"; bar.style.top = y+"px";
}

function renderLegend(){
  const ln = k=>`<svg class="ln" viewBox="0 0 34 10"><path d="M1 5H26" stroke="${KINDS[k].color}" stroke-width="2" fill="none" ${KINDS[k].dash?`stroke-dasharray="${KINDS[k].dash}"`:""}/><path d="M25 1L33 5L25 9z" fill="${KINDS[k].color}"/></svg>`;
  $("#legend").innerHTML = `<li>${ICON.star()} Major scene</li><li>${ICON.diamond()} Choice (take one, lose others)</li><li>${ICON.paw()} Dog appears</li><li>${ICON.clue()} Clue / notebook entry</li>
    <li>${ln("main")} Main path</li><li>${ln("conditional")} Conditional route</li><li>${ln("optional")} Optional / secret route</li>
    <li class="muted">Move: drag a scene. Several: Shift-drag a box, or Shift-click.</li>
    <li class="muted">Add: double-click empty space. Delete: select, then 🗑 or the Delete key.</li>
    <li class="muted">Link: drag a scene's ● onto another scene.</li>`;
  $("#kindSeg").innerHTML = Object.entries(KINDS).map(([k,v])=>`<button data-kind="${k}" aria-pressed="${k===newKind}"><svg class="linesample" viewBox="0 0 26 8"><path d="M1 4H25" stroke="${v.color}" stroke-width="2" ${v.dash?`stroke-dasharray="${v.dash}"`:""}/></svg>${v.label.split(" ")[0]}</button>`).join("");
}

/* ---------- toast with undo ---------- */
let toastTimer;
function toast(msg, withUndo){
  const t = $("#toast");
  t.innerHTML = `<span>${esc(msg)}</span>${withUndo?`<button class="btn" id="toastUndo">↶ Undo</button>`:""}`;
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 6000);
}
function hideToast(){ $("#toast").hidden = true; }
$("#toast").addEventListener("click", e=>{ if(e.target.id==="toastUndo"){ undo(); hideToast(); } });

/* ================= scene actions ================= */
function overlaps(x,y,skip){ return Object.entries(S.nodes).some(([id,n])=>id!==skip && Math.abs(n.x-x)<W+10 && Math.abs(n.y-y)<H+10); }
function freeSpot(x,y,dx,dy){ x=snap(x); y=snap(y); for(let i=0;i<60 && overlaps(x,y);i++){ x+=dx; y+=dy; } return {x,y}; }
function addSceneAt(x,y,dx=0,dy=ROW){
  const p = freeSpot(x,y,dx,dy), id = uid("n");
  mutate(()=>{ S.nodes[id] = newScene(p.x,p.y); });
  sel = {kind:"scene",id}; panelOpen = false;
  renderMap(); renderPanel();
  return id;
}
function deleteScenes(ids){
  if(!ids.length) return;
  mutate(()=>{
    ids.forEach(id=>{
      delete S.nodes[id];
      S.edges = S.edges.filter(e=>e.from!==id&&e.to!==id);
      S.threads.forEach(t=>t.scenes=t.scenes.filter(x=>x!==id));
    });
  });
  sel = null; panelOpen = false; renderMap(); renderPanel();
  toast(ids.length===1 ? "Scene deleted." : ids.length+" scenes deleted.", true);
}
function lineUp(ids, vertical){
  const ns = ids.map(id=>[id,S.nodes[id]]).sort((a,b)=>vertical ? a[1].y-b[1].y : a[1].x-b[1].x);
  const x0 = snap(ns.reduce((a,[,n])=>a+n.x,0)/ns.length), y0 = snap(ns.reduce((a,[,n])=>a+n.y,0)/ns.length);
  mutate(()=>ns.forEach(([,n],i)=>{
    if(vertical){ n.x = x0; n.y = snap(y0 + (i-(ns.length-1)/2)*ROW); }
    else { n.y = y0; n.x = snap(x0 + (i-(ns.length-1)/2)*(W+30)); }
  }));
}
function addEdge(from,to,kind){
  if(from===to) return "A scene can't link to itself.";
  if(S.edges.some(e=>e.from===from&&e.to===to)) return "Those scenes are already linked.";
  const e = {id:uid("e"),from,to,kind,color:KINDS[kind].color,label:""};
  mutate(()=>S.edges.push(e));
  return e;
}
function toggleThread(tid,id){
  const t = S.threads.find(x=>x.id===tid); if(!t) return;
  mutate(()=>{ t.scenes = t.scenes.includes(id) ? t.scenes.filter(x=>x!==id) : [...t.scenes,id]; });
}
function select(s, open){
  if(!s && document.activeElement && $("#panel").contains(document.activeElement)) document.activeElement.blur();
  sel = s; panelOpen = !!open;
  renderMap(); renderPanel();
}
function openEditor(id){ select({kind:"scene",id}, true); focusTitle(); }
function focusTitle(){ setTimeout(()=>{ const t=$("#f-title"); if(t && innerWidth>720) t.focus(); },60); }
function gotoScene(id, open){
  select({kind:"scene",id}, open);
  const n = S.nodes[id]; if(!n) return;
  const r = $("#viewport").getBoundingClientRect();
  const k = Math.max(view.k, .7);
  const right = $("#panel").hidden || innerWidth<720 ? 0 : 380, left = $("#bible").hidden || innerWidth<720 ? 0 : 380;
  animateTo(k, left + (r.width-left-right)/2 - (n.x+W/2)*k, r.height/2 - (n.y+H/2)*k);
}

/* ================= pan & zoom ================= */
const vp = $("#viewport");
function applyView(){
  $("#world").style.transform = `translate(${view.tx}px,${view.ty}px) scale(${view.k})`;
  $("#zoomPct").textContent = Math.round(view.k*100)+"%";
  placeNodebar();
}
function zoomAt(k, px, py){
  k = Math.min(2.5, Math.max(0.05, k));
  view.tx = px - (px-view.tx)*(k/view.k); view.ty = py - (py-view.ty)*(k/view.k); view.k = k; applyView();
}
let anim = null;
function animateTo(k,tx,ty){
  cancelAnimationFrame(anim);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){ Object.assign(view,{k,tx,ty}); applyView(); return; }
  const s = {...view}, t0 = performance.now();
  const step = t=>{ const u=Math.min(1,(t-t0)/280), e=1-Math.pow(1-u,3);
    view.k=s.k+(k-s.k)*e; view.tx=s.tx+(tx-s.tx)*e; view.ty=s.ty+(ty-s.ty)*e; applyView(); if(u<1) anim=requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function fit(animated=true){
  const r = vp.getBoundingClientRect(), b = L.box;
  const m = 70, bw = b.x1-b.x0 + 2*m, bh = b.y1-b.y0 + 2*m + 40;
  const k = Math.min(1.2, Math.max(0.05, Math.min(r.width/bw, r.height/bh)));
  const tx = r.width/2 - ((b.x0+b.x1)/2)*k, ty = r.height/2 - ((b.y0+b.y1)/2 - 20)*k;
  if(animated) animateTo(k,tx,ty); else { Object.assign(view,{k,tx,ty}); applyView(); }
}
function viewCenter(){ const r=vp.getBoundingClientRect(); return toWorld(r.left+r.width/2, r.top+r.height/2); }
vp.addEventListener("wheel", e=>{
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  const dy = e.deltaMode===1 ? e.deltaY*16 : e.deltaY;
  zoomAt(view.k*Math.exp(-dy*(e.ctrlKey?0.01:0.0015)), e.clientX-r.left, e.clientY-r.top);
},{passive:false});
$("#zoomIn").onclick = ()=>{ const r=vp.getBoundingClientRect(); zoomAt(view.k*1.25, r.width/2, r.height/2); };
$("#zoomOut").onclick = ()=>{ const r=vp.getBoundingClientRect(); zoomAt(view.k/1.25, r.width/2, r.height/2); };
$("#zoomFit").onclick = ()=>fit();

/* ================= pointer: move scenes, pan, box-select, link ================= */
const pointers = new Map();
let pan = null, pinch = null, drag = null, nodeDrag = null, box = null, moved = false, suppressClick = false;
function toWorld(cx,cy){ const r=vp.getBoundingClientRect(); return {x:(cx-r.left-view.tx)/view.k, y:(cy-r.top-view.ty)/view.k}; }
vp.addEventListener("pointerdown", e=>{
  if(e.button>0) return;
  const h = e.target.closest(".handle");
  if(h){ e.preventDefault(); vp.setPointerCapture(e.pointerId); drag={from:h.dataset.handle,target:null,sx:e.clientX,sy:e.clientY,moved:false}; return; }
  const node = e.target.closest(".node");
  if(node && !threadEdit){
    const id = node.dataset.id;
    const group = selectedIds().includes(id) ? selectedIds() : [id];
    const start = toWorld(e.clientX,e.clientY);
    nodeDrag = {id, group, start, origin:Object.fromEntries(group.map(g=>[g,{x:S.nodes[g].x,y:S.nodes[g].y}])), moved:false, pid:e.pointerId};
    return;
  }
  if(e.target.closest(".hit,input,button")) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  moved = false;
  if(pointers.size===1 && e.shiftKey){ vp.setPointerCapture(e.pointerId); box = {start:toWorld(e.clientX,e.clientY)}; return; }
  if(pointers.size===1){ pan={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty}; vp.classList.add("panning"); }
  if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:view.k}; pan=null; box=null; nodeDrag=null; try{ pointers.forEach((_,id)=>vp.setPointerCapture(id)); }catch{} }
});
vp.addEventListener("pointermove", e=>{
  if(nodeDrag && e.pointerId===nodeDrag.pid){
    const p = toWorld(e.clientX,e.clientY), dx = p.x-nodeDrag.start.x, dy = p.y-nodeDrag.start.y;
    if(!nodeDrag.moved){
      if(Math.hypot(dx*view.k,dy*view.k) < 5) return;
      nodeDrag.moved = true; snapshot(); lastMutKey = "";
      try{ vp.setPointerCapture(e.pointerId); }catch{}
      $("#nodebar").hidden = true; hoverId = null;
    }
    nodeDrag.group.forEach(g=>{
      const n = S.nodes[g], o = nodeDrag.origin[g];
      n.x = o.x+dx; n.y = o.y+dy;
      const el = document.querySelector(`.node[data-id="${g}"]`);
      if(el){ el.style.left = n.x+"px"; el.style.top = n.y+"px"; el.classList.add("dragging"); }
    });
    renderEdges();
    autoScroll(e);
    return;
  }
  if(drag){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>5) drag.moved=true;
    if(!drag.moved) return;
    const a = S.nodes[drag.from], sx = a.x+W, sy = a.y+H/2;
    const p = toWorld(e.clientX,e.clientY);
    const tmp = $("#tmpLine"); tmp.setAttribute("visibility","visible");
    tmp.setAttribute("d", `M${sx} ${sy} C${sx+60} ${sy} ${p.x-60} ${p.y} ${p.x} ${p.y}`);
    const under = document.elementFromPoint(e.clientX,e.clientY)?.closest(".node");
    const tid = under && under.dataset.id!==drag.from ? under.dataset.id : null;
    if(tid!==drag.target){ document.querySelector(".droptarget")?.classList.remove("droptarget"); if(tid) under.classList.add("droptarget"); drag.target=tid; }
    drag.wx=p.x; drag.wy=p.y;
    return;
  }
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(box){
    const p = toWorld(e.clientX,e.clientY), b = $("#selbox");
    box.end = p; moved = true;
    Object.assign(b.style,{left:Math.min(p.x,box.start.x)+"px", top:Math.min(p.y,box.start.y)+"px", width:Math.abs(p.x-box.start.x)+"px", height:Math.abs(p.y-box.start.y)+"px"});
    b.hidden = false;
  } else if(pinch && pointers.size===2){
    const [a,b]=[...pointers.values()], r=vp.getBoundingClientRect();
    zoomAt(pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d, (a.x+b.x)/2-r.left, (a.y+b.y)/2-r.top); moved=true;
  } else if(pan){
    const dx=e.clientX-pan.x, dy=e.clientY-pan.y;
    if(!moved && Math.abs(dx)+Math.abs(dy)>3){ moved=true; try{ vp.setPointerCapture(e.pointerId); }catch{} }
    view.tx=pan.tx+dx; view.ty=pan.ty+dy; applyView();
  }
});
function autoScroll(e){
  const r = vp.getBoundingClientRect(), m = 40, s = 12;
  let dx = 0, dy = 0;
  if(e.clientX < r.left+m) dx = s; else if(e.clientX > r.right-m) dx = -s;
  if(e.clientY < r.top+m) dy = s; else if(e.clientY > r.bottom-m) dy = -s;
  if(dx||dy){ view.tx+=dx; view.ty+=dy; nodeDrag.start.x -= dx/view.k; nodeDrag.start.y -= dy/view.k; applyView(); }
}
function endPointer(e){
  if(nodeDrag && e.pointerId===nodeDrag.pid){
    const d = nodeDrag; nodeDrag = null;
    if(d.moved){
      d.group.forEach(g=>{ const n=S.nodes[g]; n.x=snap(n.x); n.y=snap(n.y); });
      S.updatedAt = Date.now();
      suppressClick = true; setTimeout(()=>suppressClick=false, 0);
      if(!selectedIds().includes(d.id)) sel = {kind:"scene",id:d.id};
      changed();
    }
    return;
  }
  if(drag){
    const d = drag; drag = null;
    $("#tmpLine")?.setAttribute("visibility","hidden");
    document.querySelector(".droptarget")?.classList.remove("droptarget");
    if(!d.moved) return;
    if(d.target){ const r=addEdge(d.from,d.target,newKind); if(typeof r==="object") select({kind:"link",id:r.id}); else toast(r); }
    else {
      // dropped on empty space: make a new scene there, linked from this one
      const id = uid("n"), x = snap(d.wx), y = snap(d.wy - H/2);
      mutate(()=>{ S.nodes[id] = newScene(x,y); S.edges.push({id:uid("e"),from:d.from,to:id,kind:newKind,color:KINDS[newKind].color,label:""}); });
      select({kind:"scene",id});
    }
    return;
  }
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(!pointers.size){
    vp.classList.remove("panning");
    if(box){
      $("#selbox").hidden = true;
      if(box.end){
        const x0=Math.min(box.start.x,box.end.x), x1=Math.max(box.start.x,box.end.x), y0=Math.min(box.start.y,box.end.y), y1=Math.max(box.start.y,box.end.y);
        const ids = Object.keys(S.nodes).filter(id=>{ const n=S.nodes[id]; return n.x<x1 && n.x+W>x0 && n.y<y1 && n.y+H>y0; });
        select(ids.length>1 ? {kind:"multi",ids} : ids.length ? {kind:"scene",id:ids[0]} : null);
      }
      box = null; pan = null; return;
    }
    if(pan && !moved && e.type==="pointerup" && !e.target.closest(".node,.hit") && sel && sel.kind!=="generate" && sel.kind!=="sync") select(null);
    pan=null;
  }
}
vp.addEventListener("pointerup", endPointer);
vp.addEventListener("pointercancel", e=>{
  if(nodeDrag){ const d=nodeDrag; nodeDrag=null; if(d.moved){ d.group.forEach(g=>{ S.nodes[g].x=snap(S.nodes[g].x); S.nodes[g].y=snap(S.nodes[g].y); }); changed(); } }
  if(drag){ drag=null; $("#tmpLine")?.setAttribute("visibility","hidden"); }
  pointers.delete(e.pointerId); pan=null; pinch=null; box=null; $("#selbox") && ($("#selbox").hidden=true); vp.classList.remove("panning");
});

    }
    if(act==="delete"){ deleteScenes([id]); return; }
  }
  if(sel?.kind==="link"){
    const l=S.edges.find(x=>x.id===sel.id);
    const k=t.closest("[data-lkind]"); if(k){ mutate(()=>{ const def=!l.color||l.color===KINDS[l.kind].color; l.kind=k.dataset.lkind; if(def) l.color=KINDS[l.kind].color; }); return; }
    const c=t.closest("[data-lcolor]"); if(c){ mutate(()=>l.color=c.dataset.lcolor); return; }
    if(act==="reverse"){ mutate(()=>{ [l.from,l.to]=[l.to,l.from]; }); return; }
    if(act==="insert"){
      const a=S.nodes[l.from], b=S.nodes[l.to], id=uid("n");
      const p = freeSpot((a.x+b.x)/2, (a.y+b.y)/2, 0, ROW);
      mutate(()=>{ S.nodes[id]=newScene(p.x,p.y); S.edges.push({id:uid("e"),from:id,to:l.to,kind:l.kind,color:l.color,label:""}); l.to=id; });
      select({kind:"scene",id}); return;
    }
    if(act==="dellink"){ sel=null; mutate(()=>S.edges=S.edges.filter(x=>x.id!==l.id)); return; }
  }
  if(sel?.kind==="generate"){
    const gs=t.closest("[data-gstep]"), gg=t.closest("[data-ggrow]"), gd=t.closest("[data-gdir]");
    if(gs||gg||gd){ if(gs) sel.step=+gs.dataset.gstep; if(gg) sel.grow=+gg.dataset.ggrow; if(gd) sel.dir=gd.dataset.gdir; renderPanel(); return; }
    if(act==="generate"){
      const {step,grow,dir}=sel; sel=null;
      mutate(()=>{ const keep={threads:S.threads,notes:S.notes,meta:S.meta,seq:S.seq,version:3}; S=shapedMap(step,grow,dir,keep); });
      fit();
    }
  }
  if(sel?.kind==="recover"){
    const r = t.closest("[data-restore]");
    if(r){ restoreFound(+r.dataset.restore); return; }
    if(act==="rescan"){ scanSaved(true); return; }
  }

    if(act==="paste"){
      navigator.clipboard?.readText().then(x=>{ $("#s-token").value=x.trim(); }).catch(()=>{ $("#s-msg").textContent="Your browser blocked the Paste button. Tap the box and paste the usual way (long-press → Paste, or Ctrl+V / Cmd+V)."; });
      return;
    }
    if(act==="connect"){
      const btn=t.closest("[data-act]"), msg=$("#s-msg"), key=$("#s-token").value.trim();
      if(key.startsWith("github_pat_")){ msg.textContent="That's a “fine-grained” key, which can't save maps. Use the button in step 1: it opens the classic key page, and that key starts with ghp_."; return; }
      if(key && !key.startsWith("ghp_")){ msg.textContent="That doesn't look like a GitHub key. It should start with ghp_ and be about 40 characters long."; return; }
      btn.disabled=true; msg.style.color="var(--ink-2)"; msg.textContent="Connecting…";
      connectGitHub(key).then(()=>{ renderSyncBtn(); }).catch(err=>{ msg.style.color="#ffb3c0"; msg.textContent = err.offline ? "Couldn't reach GitHub. Check your internet connection." : err.message; btn.disabled=false; });
      return;
    }
    if(act==="syncnow"){ localDirty ? pushGist() : pullGist(); return; }
    if(act==="disconnect"){ disconnectGitHub(); return; }
  }
});

// Accepts this format and exports from earlier versions (which had no positions: they get laid out once).
function normalize(d){
  if(!d || typeof d!=="object") throw new Error("empty file");
  if(d.acts && d.scenes && !d.nodes){
    const nodes={}, edges=[]; let seq=d.seq||1000;
    d.acts.forEach((a,ai)=>a.scenes.forEach((id,i)=>{ if(d.scenes[id]) nodes[id]={...newScene(ai*COL, i*ROW), ...d.scenes[id], x:ai*COL, y:i*ROW}; }));
    (d.links||[]).forEach(l=>{ if(nodes[l.from]&&nodes[l.to]) edges.push({...l}); });
    d = {version:3,updatedAt:d.updatedAt||0,seq,dir:"across",meta:{title:d.meta?.title||"The Long Way Home",subtitle:d.meta?.subtitle||""},nodes,edges,threads:d.threads||[],notes:d.notes||""};
  }
  if(typeof d.nodes!=="object" || !Array.isArray(d.edges)) throw new Error("no scenes found");
  d.meta ||= {title:"",subtitle:""}; d.threads ||= []; d.notes ??= ""; d.dir ||= "across";
  d.seq = Math.max(d.seq||0, 1000);
  d.edges = d.edges.filter(e=>d.nodes[e.from]&&d.nodes[e.to]&&KINDS[e.kind]);
  d.threads.forEach(t=>{ t.scenes=(t.scenes||[]).filter(id=>d.nodes[id]); t.note ??= ""; });
  const unplaced = Object.keys(d.nodes).filter(id=>typeof d.nodes[id].x!=="number" || typeof d.nodes[id].y!=="number");
  if(unplaced.length) placeByLinks(d, unplaced);
  d.version = 3;
  return d;
}
// one-off layout for scenes from older versions: column = longest chain of main links leading to it
function placeByLinks(d, ids){
  const col = {}; ids.forEach(id=>col[id]=0);
  const main = d.edges.filter(e=>e.kind==="main");
  for(let pass=0; pass<ids.length; pass++){
    let changedAny=false;
    main.forEach(e=>{ if(e.to in col && e.from in col && col[e.to] < col[e.from]+1 && col[e.from]+1 < ids.length){ col[e.to]=col[e.from]+1; changedAny=true; } });
    if(!changedAny) break;
  }
  const byCol = {}; ids.forEach(id=>(byCol[col[id]] ||= []).push(id));
  Object.entries(byCol).forEach(([c,list])=>list.forEach((id,j)=>{ d.nodes[id].x = +c*COL; d.nodes[id].y = Math.round((j-(list.length-1)/2)*ROW - H/2); }));
}

// Three places a map can live, in order of preference:
//  1. inside a Claude artifact (the page republishes its own map.json),

function flash(msg,bad){ setStatus(bad?"error":saveState.s,msg); clearTimeout(toastT); toastT=setTimeout(()=>setStatus(saveState.s,saveState.msg),4500); }
let localDirty = false;

/* ---------- automatic backups + recovery ---------- */
// Every few minutes of editing, a copy of the map is kept (the last 25), so a crash, a bad
// edit or a lost draft can be undone from the Recover screen.
const BACKUP_KEY = "long-way-home-v3:backups";
const BACKUP_EVERY = 3*60*1000, BACKUP_KEEP = 25;
function readBackups(){ try{ return JSON.parse(localStorage.getItem(BACKUP_KEY)||"[]") || []; }catch{ return []; } }
function maybeBackup(force){
  const list = readBackups();
  const last = list[list.length-1];
  if(!force && last && Date.now()-last.t < BACKUP_EVERY) return;
  if(!hasContent(S)) return;
  list.push({t:Date.now(), state:S});
  while(list.length > BACKUP_KEEP) list.shift();
  try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(list)); }
  catch{ try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(list.slice(-5))); }catch{} }
}
window.addEventListener("pagehide", ()=>{ if(localDirty) maybeBackup(true); });
try{ navigator.storage?.persist?.(); }catch{}

function mapInfo(d){
  const nodes = d.nodes ? Object.values(d.nodes) : [];
  return {scenes:nodes.length, named:nodes.filter(n=>(n.title||"").trim()).length,
          notes:nodes.filter(n=>(n.notes||"").trim()||(n.desc||"").trim()).length,
          links:(d.edges||[]).length, threads:(d.threads||[]).filter(t=>(t.scenes||[]).length).length,
          bible:(d.notes||"").trim().length>0};
}
function hasContent(d){ const i = mapInfo(d); return i.named || i.notes || i.links || i.threads || i.bible; }
let found = [];
function addFound(label, raw, when){
  try{
    const st = normalize(clone(raw));
    const info = mapInfo(st);
    if(!info.scenes) return;
    const sig = JSON.stringify(st.nodes)+JSON.stringify(st.edges)+JSON.stringify(st.notes);
    if(found.some(f=>f.sig===sig)) return;
    found.push({label, state:st, when: when || st.updatedAt || 0, info, sig});
  }catch{}
}
async function scanSaved(rerender){
  found = [];
  const names = {
    [LS_KEY]: "Your current save on this device",
    "long-way-home-diamond:draft": "Saved by the earlier diamond version of the app",
    "long-way-home-map:draft": "Saved by the first (columns) version of the app",
  };
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(!/long-way-home/i.test(k) || /:sync$/.test(k)) continue;
    let v; try{ v = JSON.parse(localStorage.getItem(k)); }catch{ continue; }
    if(k===BACKUP_KEY && Array.isArray(v)){ v.forEach(b=>addFound("Automatic backup", b.state, b.t)); continue; }
    const st = v && (v.state || v);
    if(st && (st.nodes || st.acts)) addFound(names[k] || ("Saved on this device ("+k+")"), st);
  }
  // copies kept on GitHub by the sync feature, current and earlier versions
  for(const key of ["long-way-home-v3:sync", "long-way-home-diamond:sync"]){
    let sv; try{ sv = JSON.parse(localStorage.getItem(key)||"null"); }catch{}
    if(!sv?.token || !sv?.gistId) continue;
    try{
      const g = await gh("/gists/"+sv.gistId, {}, sv.token);
      for(const [fname, f] of Object.entries(g.files||{})){
        if(!/^long-way-home-map/.test(fname)) continue;
        const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
        addFound("Saved on GitHub by the sync feature", JSON.parse(text));
      }
    }catch{}
  }
  found.sort((a,b)=>b.when-a.when);
  if(rerender && sel?.kind==="recover") renderPanel();
  return found;
}

function restoreFound(i){
  const f = found[i]; if(!f) return;
  snapshot();
  S = normalize(clone(f.state)); S.updatedAt = Date.now();
  sel = null; threadEdit = null; threadShow = null;
  renderAll(); fit(); persistLocal(true); scheduleSave();
  toast("Map restored. Undo goes back to what was on screen.", true);
}
const capCache = {};
function capability(name){
  if(!(name in capCache)) capCache[name] = (window.claude && typeof window.claude.use==="function") ? window.claude.use(name).catch(()=>null) : Promise.resolve(null);
  return capCache[name];
}
let artifactApi=null, canPublish=false, saveTimer=null, saving=false, pending=false, backoff=2500;
function scheduleSave(){
  clearTimeout(saveTimer);
  if(canPublish){ status("saving","Unsaved changes…"); saveTimer=setTimeout(publishNow, backoff); return; }
  if(sync.gistId){ status("saving","Unsaved changes…"); saveTimer=setTimeout(pushGist, 2500); return; }
  status("local","Saved on this device");
}
async function publishNow(retried){
  if(!canPublish) return;
  if(saving){ pending=true; return; }
  saving=true; status("saving","Saving…");
  try{
    await artifactApi.publish({"map.json":{content:JSON.stringify(S),contentType:"application/json"}});
    persistLocal(false); backoff=2500; status("saved","All changes saved");
  }catch(err){
    const code=err&&err.code;
    if(code==="conflict") status("error","Someone else saved. Loading their version; your draft stays in this browser.");
    else if(code==="rate_limited"){ backoff=Math.min(backoff*2,30000); status("saving","Saving shortly…"); clearTimeout(saveTimer); saveTimer=setTimeout(publishNow,backoff); }
    else if(code==="upstream_error" && !retried){ saving=false; setTimeout(()=>publishNow(true),1500+Math.random()*1500); return; }
    else if(["not_writer","not_granted","capability_disabled","capability_removed","not_declared","consent_required"].includes(code)){ canPublish=false; status("local","View only here · edits kept in this browser"); }
    else status("error","Couldn't save. Edits are kept in this browser; use Export for a copy.");
  }
  saving=false;
  if(pending){ pending=false; publishNow(); }
}

/* ---------- GitHub gist sync ---------- */
const SYNC_KEY = "long-way-home-v3:sync";
const GIST_FILE = "long-way-home-map-v3.json";
const TOKEN_URL = "https://github.com/settings/tokens/new?scopes=gist&description=Long%20Way%20Home%20map";
let sync = {};
try{ sync = JSON.parse(localStorage.getItem(SYNC_KEY)||"{}") || {}; }catch{}
function saveSync(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); }catch{} }
let syncBusy = false, syncQueued = false, lastSyncAt = 0, conflictRemote = null, syncError = "";
async function gh(path, opts={}, token=sync.token){
  let r;
  try{ r = await fetch("https://api.github.com"+path, {...opts, cache:"no-store", headers:{Accept:"application/vnd.github+json", Authorization:"Bearer "+token, ...(opts.body?{"Content-Type":"application/json"}:{})}}); }
  catch{ const e=new Error("offline"); e.offline=true; throw e; }
  if(!r.ok){
    const e = new Error(r.status===401 ? "GitHub didn't accept the key. It may have been deleted or expired." : r.status===403 ? "GitHub refused the request. Check the key has the “gist” box ticked." : r.status===404 ? "The saved map wasn't found on GitHub." : "GitHub error "+r.status+".");
    e.status = r.status; throw e;
  }
  return r.json();
}
async function readGist(id, token){
  const g = await gh("/gists/"+id, {}, token);
  const f = g.files && g.files[GIST_FILE];
  if(!f) { const e=new Error("The saved map wasn't found on GitHub."); e.status=404; throw e; }
  const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
  return normalize(JSON.parse(text));
}
function syncFailed(err){
  if(err.offline){ status("local","Offline · saved on this device, will sync when back online"); return; }
  syncError = err.message; status("error", err.message);
  if(sel?.kind==="sync") renderPanel();
}
async function connectGitHub(token){
  token = token.trim();
  if(!token) throw new Error("Paste the key from GitHub first.");
  const me = await gh("/user", {}, token);
  let id = null;
  for(let page=1; page<=10 && !id; page++){
    const list = await gh(`/gists?per_page=100&page=${page}`, {}, token);
    const hit = list.find(g=>g.files && g.files[GIST_FILE]); if(hit) id = hit.id;
    if(list.length<100) break;
  }
  let loadedRemote = false;
  if(id){
    const remote = await readGist(id, token);
    undoStack.push(clone(S)); redoStack=[];
    S = remote; loadedRemote = true;
  } else {
    if(!S.updatedAt) S.updatedAt = Date.now();
    const g = await gh("/gists", {method:"POST", body:JSON.stringify({description:"The Long Way Home story map (saved by the map app; edit it in the app)", public:false, files:{[GIST_FILE]:{content:JSON.stringify(S)}}})}, token);
    id = g.id;
  }
  sync = {token, gistId:id, login:me.login, base:S.updatedAt||0};
  saveSync(); persistLocal(false); lastSyncAt = Date.now(); syncError = "";
  sel = null; threadEdit = null; renderAll(); fit();
  status("saved","Synced");
  flash(loadedRemote ? "Loaded your map from GitHub. Undo brings back the one that was on this device." : "Connected. This map now syncs to GitHub.");
}
async function pushGist(){
  if(!sync.gistId) return;
  if(syncBusy){ syncQueued = true; return; }
  syncBusy = true; status("saving","Syncing…");
  try{
    const remote = await readGist(sync.gistId);
    const r = remote.updatedAt||0;
    if(r > (sync.base||0) && r !== S.updatedAt){ showConflict(remote); return; }
    const sentAt = S.updatedAt||0, body = JSON.stringify(S);
    await gh("/gists/"+sync.gistId, {method:"PATCH", body:JSON.stringify({files:{[GIST_FILE]:{content:body}}})});
    sync.base = sentAt; saveSync(); lastSyncAt = Date.now(); syncError = "";
    if((S.updatedAt||0)===sentAt) persistLocal(false); else syncQueued = true;
    status("saved","Synced");
  }catch(err){ syncFailed(err); }
  finally{
    syncBusy = false;
    if(syncQueued){ syncQueued=false; pushGist(); }
    if(sel?.kind==="sync") renderPanel();
  }
}
async function pullGist(){
  if(!sync.gistId || syncBusy || conflictRemote) return;
  syncBusy = true;
  try{
    const remote = await readGist(sync.gistId);
    const r = remote.updatedAt||0;
    lastSyncAt = Date.now(); syncError = "";
    if(r > (sync.base||0) && r !== S.updatedAt){
      if(localDirty){ syncBusy=false; showConflict(remote); return; }
      S = remote; sync.base = r; saveSync(); persistLocal(false);
      if(sel?.kind==="scene" && !S.nodes[sel.id]) sel=null;
      renderAll(); status("saved","Synced"); flash("Loaded changes from another device.");
    } else if(localDirty){ syncBusy=false; pushGist(); return; }
    else status("saved","Synced");
  }catch(err){ syncFailed(err); }
  syncBusy = false;
  if(sel?.kind==="sync") renderPanel();
}
function showConflict(remote){
  conflictRemote = remote;
  status("error","Changed on another device");
  renderBanner();
}
$("#bannerSlot").addEventListener("click", e=>{
  if(e.target.id==="cfTheirs" && conflictRemote){
    undoStack.push(clone(S)); redoStack=[];
    S = conflictRemote; sync.base = S.updatedAt||0; conflictRemote=null; saveSync(); persistLocal(false);
    sel=null; renderAll(); status("saved","Synced"); flash("Loaded the other device's version. Undo brings yours back (then it syncs again).");
  }
  if(e.target.id==="cfMine" && conflictRemote){
    sync.base = conflictRemote.updatedAt||0; conflictRemote=null; saveSync(); S.updatedAt = Date.now(); renderBanner(); pushGist();
  }
});
function disconnectGitHub(){ sync = {}; saveSync(); renderSyncBtn(); status("local","Saved on this device"); renderPanel(); }
function renderSyncBtn(){
  const b = $("#syncBtn");
  b.hidden = canPublish;
  b.textContent = sync.gistId ? "☁ Synced" : "☁ Sync devices";
  b.setAttribute("aria-pressed", !!sync.gistId);
}
function syncPanelHTML(){
  if(sync.gistId){
    const when = lastSyncAt ? new Date(lastSyncAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "not yet";
    return `<header><span class="pnum">☁</span><h3>Sync<small>Connected to GitHub as ${esc(sync.login||"you")}</small></h3><button class="icon-btn" id="pclose" aria-label="Close">✕</button></header>
    <div class="pbody">
      <p>Every change saves to a private copy in your GitHub account. Open the app on another device, connect it with a key, and you'll see the same map.</p>
      <p class="muted">Last synced: ${when}${syncError?`<br><span style="color:#ffb3c0">${esc(syncError)}</span>`:""}</p>
      <div class="row"><button class="btn primary" data-act="syncnow">Sync now</button><a class="btn" href="https://gist.github.com/${esc(sync.login||"")}/${esc(sync.gistId)}" target="_blank" rel="noopener">View on GitHub</a></div>
      <hr class="divider">
      <p class="muted">Disconnecting only affects this device. Your map stays on GitHub and on your other devices.</p>
      <div class="row"><button class="btn danger" data-act="disconnect">Disconnect this device</button></div>
    </div>`;
  }
  return `<header><span class="pnum">☁</span><h3>Sync your devices<small>Same map on your laptop, phone and tablet</small></h3><button class="icon-btn" id="pclose" aria-label="Close">✕</button></header>
  <div class="pbody">
    <p>To keep one map on all your devices, the app needs a <b>key</b> from your GitHub account. It's a long password-like code. You make it once, then paste it into the app on each device.</p>
    <div class="step"><b>1</b><div><p><a class="btn primary" href="${TOKEN_URL}" target="_blank" rel="noopener">Open GitHub to make a key ↗</a></p>
      <p class="muted">It opens in a new tab. Sign in if GitHub asks, and confirm your password if it asks again.</p></div></div>
    <div class="step"><b>2</b><div><p>On that page, the <b>Note</b> box already says “Long Way Home map” and the <b>gist</b> box is already ticked. Leave them.</p>
      <p class="muted">Optional: change <b>Expiration</b> to <b>No expiration</b>, or the key stops working after 30 days.</p></div></div>
    <div class="step"><b>3</b><div><p>Scroll to the bottom and press the green <b>Generate token</b> button.</p></div></div>
    <div class="step"><b>4</b><div><p>GitHub shows a code starting with <code>ghp_</code>. Press the copy icon (two squares) next to it.</p>
      <p class="muted">GitHub only shows it once. If you lose it, just make another.</p></div></div>
    <div class="step"><b>5</b><div><p>Come back to this tab, paste the code in the box below, and press <b>Connect</b>.</p></div></div>
    <div class="field"><label for="s-token">Your GitHub key</label>
      <div class="row" style="flex-wrap:nowrap"><input class="inp" id="s-token" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…"><button class="btn" data-act="paste">Paste</button></div></div>
    <div class="row"><button class="btn primary" data-act="connect" style="font-size:16px;padding:8px 18px">Connect</button></div>
    <span id="s-msg" style="color:#ffb3c0"></span>
    <hr class="divider">
    <p class="muted"><b>What happens next:</b> on the first device you connect, the map on it is uploaded. On every other device, that map is downloaded (the one that was there is one Undo away). The key stays on this device and can only save and read your maps.</p>
  </div>`;
}

async function boot(){
  let loaded=null, draft=null, draftWins=false;
  try{ const r=await fetch("map.json",{cache:"no-store"}); if(r.ok){ const d=await r.json(); if(d) loaded=normalize(d); } }catch{}
  try{ draft=JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(draft?.state) draft.state=normalize(draft.state); else draft=null; }catch{ draft=null; }
  if(draft && (!loaded || (draft.dirty && (draft.state.updatedAt||0)>(loaded.updatedAt||0)))) draftWins=true;
  S = draftWins ? draft.state : (loaded || S);
  localDirty = !!(draftWins && draft.dirty);
  renderAll(); fit(false);
  status("local","Saved on this device");
  artifactApi = await capability("artifact");
  if(artifactApi){ canPublish=true; if(draftWins && loaded && draft.dirty) scheduleSave(); else status("saved","All changes saved"); }
  renderSyncBtn();
  if(!canPublish && sync.gistId){ status("saving","Syncing…"); pullGist(); }
  // nothing of yours on screen but something saved earlier? offer it straight away
  scanSaved().then(list=>{
    if(!hasContent(S) && list.some(f=>hasContent(f.state)) && !sel){ select({kind:"recover"}); toast("Found a map saved earlier on this device. Pick one to restore."); }
  });
  if(!canPublish && "serviceWorker" in navigator && location.protocol==="https:"){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && !canPublish && sync.gistId && Date.now()-lastSyncAt>5000) pullGist(); });
window.addEventListener("online", ()=>{ if(!canPublish && sync.gistId) (localDirty ? pushGist() : pullGist()); });
$("#syncBtn").onclick = ()=>select({kind:"sync"});
$("#recoverBtn").onclick = ()=>{ select({kind:"recover"}); scanSaved(true); };
document.fonts?.ready.then(()=>renderEdges());
boot();
})();
</script>
