<title>The Long Way Home</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@500&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#0b1422;
  --night-2:#101c2e;
  --panel:#132236;
  --panel-2:#1a2c44;
  --line:#2a3f5c;
  --ink:#e9eef8;
  --ink-2:#aebbd2;
  --ink-3:#7485a3;
  --gold:#f5c451;
  --choice:#ff5d7a;
  --focus:#9fd0ff;
  --display:"Cinzel","Trajan Pro","Palatino Linotype",Georgia,serif;
  --body:"Alegreya Sans","Gill Sans","Segoe UI",system-ui,sans-serif;
  --hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
}
*{box-sizing:border-box}
html,body{background:var(--night);color:var(--ink)}
body{
  margin:0;font:15px/1.4 var(--body);
  background:
    radial-gradient(1200px 500px at 70% -10%, #1d3350 0%, transparent 60%),
    radial-gradient(800px 400px at 0% 0%, #142741 0%, transparent 70%),
    var(--night);
  min-height:100vh;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{padding-inline:16px;padding-block:18px 40px;max-width:1720px;margin:0 auto}

/* ---------- Header ---------- */
.masthead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 32px;align-items:start}
.bare{background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin:0 -6px;width:100%;resize:none;overflow:hidden}
.bare:hover{border-color:var(--line)}
.bare:focus{border-color:var(--focus);outline:none;background:rgba(255,255,255,.03)}
#m-title{font:600 clamp(28px,4.4vw,52px)/1.05 var(--display);letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
#m-subtitle{font:600 clamp(16px,2vw,24px)/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
#m-tagline{font:500 12px/1.4 var(--body);letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3)}
#m-quote{font:500 22px/1.15 var(--hand);color:#dfe7f5;width:280px;transform:rotate(-3deg);text-align:left}
.stats{margin-top:6px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.04em}

/* ---------- Toolbar ---------- */
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;margin-block:14px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 10px;background:rgba(13,23,38,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:10px}
.tgroup{display:flex;gap:4px;align-items:center}
.tlabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.btn{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:14px;line-height:1.2;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:#3d5a80;background:#20365280}
.btn:disabled{opacity:.4;cursor:default}
.btn.danger{border-color:#6b2a3a;color:#ffb3c0}
.btn.danger.armed{background:#6b2a3a;color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;font-size:14px;display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:#24405f;color:var(--ink)}
.linesample{width:26px;height:8px;display:inline-block}
.status{margin-left:auto;font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.status[data-s="saved"] i{background:#5ed49b}
.status[data-s="saving"] i{background:var(--gold)}
.status[data-s="local"] i{background:#6aa8ff}
.status[data-s="error"] i{background:var(--choice)}
.hint{font-size:13px;color:var(--ink-3);margin:-6px 0 12px}
.hint kbd{font:inherit;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--ink-2)}

.banner{display:flex;gap:12px;align-items:center;padding:8px 12px;margin-bottom:12px;border-radius:8px;border:1px solid var(--tc,#4fc8f0);background:color-mix(in srgb,var(--tc,#4fc8f0) 14%,transparent)}
.banner b{color:var(--tc)}

/* ---------- Board ---------- */
.board-scroll{overflow-x:auto;overflow-y:visible;padding-bottom:6px;margin-inline:-4px;padding-inline:4px}
.board{position:relative;display:flex;gap:34px;align-items:flex-start;width:max-content;padding:2px 26px 2px 26px}
.act{--c:#63b3ff;width:268px;flex:none;border:1.5px solid color-mix(in srgb,var(--c) 70%,transparent);border-radius:12px;padding:12px 12px 12px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,#0d1726) 0%,color-mix(in srgb,var(--c) 7%,#0b1422) 100%);box-shadow:0 0 22px color-mix(in srgb,var(--c) 22%,transparent)}
.act-head{text-align:center;margin-bottom:10px;position:relative}
.act-kicker{font:600 11px var(--body);letter-spacing:.24em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 70%,#fff)}
.act-name{font:600 19px/1.2 var(--display);letter-spacing:.08em;text-transform:uppercase;text-align:center;color:color-mix(in srgb,var(--c) 55%,#fff)}
.act-sub{font-size:14px;text-align:center;color:var(--ink-2)}
.act-x{position:absolute;right:-4px;top:-4px;border:0;background:none;color:var(--ink-3);font-size:18px;line-height:1}
.scenes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.card{position:relative;display:grid;grid-template-columns:30px 28px minmax(0,1fr) auto;align-items:center;min-height:50px;border-radius:8px;background:color-mix(in srgb,var(--c) 22%,#0f1a2b);border:1px solid color-mix(in srgb,var(--c) 50%,transparent);cursor:pointer;transition:opacity .15s,box-shadow .15s,transform .1s}
.card:not(:last-child)::after{content:"";position:absolute;left:50%;bottom:-11px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid color-mix(in srgb,var(--c) 70%,#fff);opacity:.7;transform:translateX(-50%)}
.card:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 80%,#fff),0 0 14px color-mix(in srgb,var(--c) 40%,transparent)}
.card.sel{box-shadow:0 0 0 2px #fff,0 0 18px color-mix(in srgb,var(--c) 60%,transparent)}
.card.choice{--c:var(--choice)}
.card.dim{opacity:.28}
.card.member{box-shadow:0 0 0 2px var(--tc),0 0 14px color-mix(in srgb,var(--tc) 55%,transparent)}
.num{align-self:stretch;display:grid;place-items:center;font:700 14px var(--body);font-variant-numeric:tabular-nums;border-radius:7px 0 0 7px;background:color-mix(in srgb,var(--c) 38%,#e9eef8 30%);color:#0b1422}
.glyph{display:grid;place-items:center;align-self:stretch;background:rgba(0,0,0,.18)}
.glyph svg{width:18px;height:18px}
.body{padding:6px 8px;min-width:0}
.t{display:block;font-weight:700;font-size:14.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t.empty{font-weight:400;font-style:italic;color:var(--ink-3)}
.d{display:block;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.extras{display:flex;gap:3px;align-items:center;padding-right:10px}
.extras svg{width:12px;height:12px}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--tc)}
.handle{position:absolute;right:-7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#0b1422;border:2px solid color-mix(in srgb,var(--c) 70%,#fff);opacity:0;cursor:crosshair;touch-action:none;transition:opacity .12s;z-index:3}
.card:hover .handle,.card.sel .handle,.card:focus-within .handle{opacity:1}
@media (hover:none){.handle{opacity:.85}}
.card.droptarget{box-shadow:0 0 0 2px var(--gold),0 0 16px rgba(245,196,81,.5)}
.add-scene{margin-top:10px;width:100%;border:1px dashed color-mix(in srgb,var(--c) 45%,transparent);background:transparent;border-radius:8px;padding:6px;color:var(--ink-3);font-size:13px}
.add-scene:hover{color:var(--ink);border-style:solid}
.add-act{align-self:stretch;width:120px;flex:none;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--ink-3);font:600 13px var(--display);letter-spacing:.1em;text-transform:uppercase}
.add-act:hover{color:var(--ink);border-color:#3d5a80}

svg#links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:2}
.lk{transition:opacity .15s}
.lk .vis{fill:none;stroke-width:2;stroke-linecap:round}
.lk .hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:stroke;cursor:pointer}
.lk:hover .vis,.lk.sel .vis{stroke-width:3.2}
.lk.sel .vis{filter:drop-shadow(0 0 4px currentColor)}
.lk.dim{opacity:.1}
.lk text{font:600 11px var(--body);paint-order:stroke;stroke:#0b1422;stroke-width:4px;stroke-linejoin:round}
[hidden]{display:none!important}
.tmp{fill:none;stroke:var(--gold);stroke-width:2;stroke-dasharray:4 4}

/* ---------- Lower panels ---------- */
.lower{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:22px}
.box{border:1px solid var(--line);border-radius:10px;background:rgba(16,28,46,.8);padding:12px 14px}
.box h2{margin:0 0 10px;font:600 14px var(--display);letter-spacing:.16em;text-transform:uppercase;color:#bfe3ff;display:flex;align-items:baseline;gap:10px}
.box h2 small{font:400 13px var(--body);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.thread{display:grid;grid-template-columns:170px minmax(160px,1fr) minmax(0,.8fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:rgba(0,0,0,.14)}
.thread.editing{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc)}
.tname{display:flex;align-items:center;gap:8px;min-width:0}
.swatch{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 30%,transparent);padding:0}
.tname input{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--tc)}
.track{position:relative;height:34px}
.track::before{content:"";position:absolute;left:0;right:0;top:11px;height:2px;background:var(--tc);opacity:.55;border-radius:2px}
.tick{position:absolute;top:4px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;border:0;background:none;padding:0;color:var(--ink-2);font-size:11px;font-variant-numeric:tabular-nums}
.tick i{width:16px;height:16px;border-radius:50%;border:2px solid var(--tc);background:#0b1422;display:block}
.tick:hover i{background:var(--tc)}
.track .empty{position:absolute;left:0;top:16px;white-space:nowrap;font-size:12px;color:var(--ink-3);font-style:italic}
.tnote{font-size:13px;color:var(--ink-2)}
.tactions{display:flex;gap:4px}
.icon-btn{border:1px solid var(--line);background:transparent;border-radius:6px;padding:3px 8px;font-size:13px;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);border-color:#3d5a80}
.icon-btn[aria-pressed="true"]{background:var(--tc);color:#0b1422;border-color:var(--tc)}
.key{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:14px;color:var(--ink-2)}
.key li{display:flex;gap:10px;align-items:center}
.key svg{width:18px;height:18px;flex:none}
.key .ln{width:38px;height:10px;flex:none}
#notes{width:100%;min-height:190px;background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;line-height:1.5}
.aside{font:500 23px/1.1 var(--hand);color:#d9c9a0;transform:rotate(-4deg);margin-top:14px;text-align:center;white-space:pre-line}
#m-aside{font:500 22px/1.1 var(--hand);color:#e4d3a6;text-align:center}

/* ---------- Side panel ---------- */
.panel{position:fixed;right:0;top:0;bottom:0;width:min(380px,100%);z-index:50;background:#0f1b2c;border-left:1px solid var(--line);box-shadow:-20px 0 40px rgba(0,0,0,.45);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.panel header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel header .pnum{font:700 18px var(--body);min-width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:var(--pc,#63b3ff);color:#0b1422;font-variant-numeric:tabular-nums}
.panel header h3{margin:0;font:600 15px var(--display);letter-spacing:.1em;text-transform:uppercase;flex:1}
.panel header h3 small{display:block;font:400 13px var(--body);letter-spacing:0;text-transform:none;color:var(--ink-3)}
.pbody{overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.flabel{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.inp{background:#0b1422;border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%}
.inp:focus{border-color:var(--focus);outline:none}
textarea.inp{min-height:110px;resize:vertical;line-height:1.45}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;cursor:pointer;user-select:none}
.chk input{margin:0;accent-color:var(--gold)}
.chip{border:1px solid var(--tc);border-radius:999px;padding:3px 10px;font-size:13px;background:transparent;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center}
.chip i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--tc)}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--tc) 25%,transparent);color:var(--ink)}
.chip[aria-pressed="true"] i{background:var(--tc)}
.links-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.links-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:7px}
.links-list .go{border:0;background:none;padding:0;text-align:left;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.links-list .go:hover{text-decoration:underline}
.pill{font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:1px 7px;border:1px solid currentColor}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3);font-size:13px}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0;background:var(--sw)}
.colors button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #0f1b2c inset}
.divider{border:0;border-top:1px solid var(--line);margin:4px 0}

@media (max-width:1100px){.lower{grid-template-columns:1fr 1fr}.lower .threads{grid-column:1/-1}}
@media (max-width:720px){
  .masthead{grid-template-columns:1fr}
  #m-quote{width:100%;transform:none}
  .lower{grid-template-columns:1fr}
  .thread{grid-template-columns:1fr;gap:6px}
  .panel{top:auto;height:72vh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0}
  .status{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="masthead">
    <div>
      <input class="bare" id="m-title" aria-label="Map title" spellcheck="false">
      <input class="bare" id="m-subtitle" aria-label="Map subtitle" spellcheck="false">
      <input class="bare" id="m-tagline" aria-label="Tagline" spellcheck="false">
      <div class="stats" id="stats"></div>
    </div>
    <textarea class="bare" id="m-quote" rows="4" aria-label="Quote" spellcheck="false"></textarea>
  </header>

  <div class="toolbar" role="toolbar" aria-label="Map tools">
    <div class="tgroup">
      <button class="btn" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button class="btn" id="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    </div>
    <div class="tgroup">
      <span class="tlabel">New links</span>
      <div class="seg" id="kindSeg"></div>
    </div>
    <div class="tgroup">
      <button class="btn" id="export">Export JSON</button>
      <label class="btn" for="importFile" style="cursor:pointer">Import JSON</label>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <button class="btn danger" id="reset">Reset to blank</button>
    </div>
    <div class="status" id="status" data-s="local"><i></i><span>Loading…</span></div>
  </div>
  <p class="hint">Click a scene to edit it. Drag the ◦ handle on a scene's right edge onto another scene to link them. Hover a scene to trace its routes. <kbd>Ctrl</kbd>+<kbd>Z</kbd> undoes.</p>
  <div id="bannerSlot"></div>

  <div class="board-scroll" id="boardScroll">
    <div class="board" id="board"></div>
  </div>

  <section class="lower">
    <div class="box threads">
      <h2>Recurring threads <small>appear across multiple scenes</small></h2>
      <div id="threads"></div>
      <button class="btn" id="addThread">+ Add thread</button>
    </div>
    <div class="box">
      <h2>Key</h2>
      <ul class="key" id="key"></ul>
    </div>
    <div class="box">
      <h2>Notes</h2>
      <textarea id="notes" aria-label="Notes" placeholder="Design notes, open questions, ideas…"></textarea>
      <textarea class="bare" id="m-aside" rows="3" aria-label="Margin note" spellcheck="false"></textarea>
    </div>
  </section>
</div>

<aside class="panel" id="panel" hidden aria-label="Editor"></aside>

<script>
(() => {
"use strict";

/* ================= constants ================= */
const ACT_COLORS = ["#63b3ff","#f4a74c","#5ed49b","#b48cff","#ff6b81","#4fd3d6"];
const LINK_COLORS = ["#e6ebf5","#f5c451","#ff6fa8","#4fd6e0","#6aa8ff","#8fe07a","#b48cff"];
const THREAD_COLORS = ["#c3e05a","#ff6f8e","#4fc8f0","#b98bff","#f5c451","#6ee0b0","#ff9a5a"];
const KINDS = {
  main:        {label:"Main path",   dash:"",    color:"#e6ebf5", desc:"always connects"},
  conditional: {label:"Conditional", dash:"7 5", color:"#f5c451", desc:"item / state dependent"},
  optional:    {label:"Optional",    dash:"2 5", color:"#4fd6e0", desc:"secret route"},
};
const ROMAN = ["I","II","III","IV","V","VI","VII","VIII","IX","X"];
const ICON = {
  star:    c => `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="${c||"#f5c451"}" d="M12 2.4l2.9 6.2 6.7.8-5 4.6 1.4 6.6L12 17.3l-6 3.3 1.4-6.6-5-4.6 6.7-.8z"/></svg>`,
  diamond: c => `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="${c||"#ff5d7a"}" d="M12 2.5 20 12l-8 9.5L4 12z"/></svg>`,
  paw:     c => `<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="${c||"#6fc3ff"}"><ellipse cx="12" cy="16" rx="5" ry="4.2"/><circle cx="5.5" cy="10.5" r="2.2"/><circle cx="9.5" cy="6.5" r="2.2"/><circle cx="14.5" cy="6.5" r="2.2"/><circle cx="18.5" cy="10.5" r="2.2"/></g></svg>`,
  clue:    c => `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7" fill="${c||"#4fa9ff"}"/><circle cx="10" cy="10" r="2.4" fill="#d6ecff"/></svg>`,
};
const LS_KEY = "long-way-home-map:draft";

/* ================= default blank map ================= */
function blankMap(){
  const acts = [["Curiosity","Strange things begin to happen"],["Patterns","Things start to repeat"],
    ["Connections","Choices begin to pay off"],["Understanding","The rules become clearer"],["The Search","Everything comes together"]];
  const major = [1,8,14,24,30,33,42,47,49,50], choice = [4,10,20,25,40,43,48];
  const scenes = {};
  for(let n=1;n<=50;n++) scenes["s"+n] = {title:"",desc:"",type:major.includes(n)?"major":choice.includes(n)?"choice":"normal",dog:false,clue:false,notes:""};
  const L = [[4,11,"conditional",1],[4,15,"conditional",2],[7,10,"optional",3],[10,4,"main",2],[10,20,"main",2],
    [11,21,"optional",3],[11,22,"conditional",2],[14,6,"conditional",1],[15,26,"optional",3],[20,30,"main",1],
    [24,14,"conditional",5],[24,31,"conditional",1],[23,33,"optional",3],[25,35,"conditional",2],[30,40,"main",2],
    [33,42,"conditional",2],[35,41,"optional",3],[35,44,"conditional",1],[38,48,"optional",3],[40,47,"conditional",1],[43,48,"conditional",1]];
  return {
    version:1, updatedAt:0,
    meta:{title:"The Long Way Home",subtitle:"50 Scene Master Map",tagline:"A journey through memory, dreams and what remains",
      quote:"“Places change.\nPeople echo.\nChoices matter.\nThe story is yours to fill in.”",
      aside:"Not all who wander are lost.\nSome are just on a different route home."},
    acts: acts.map(([name,subtitle],i)=>({id:"a"+(i+1),name,subtitle,color:ACT_COLORS[i],scenes:Array.from({length:10},(_,k)=>"s"+(i*10+k+1))})),
    scenes,
    links: L.map(([f,t,kind,c],i)=>({id:"l"+(i+1),from:"s"+f,to:"s"+t,kind,color:LINK_COLORS[c],label:""})),
    threads: [["The Giant",0],["The Dog",1],["The Search",2],["Other motifs",3]].map(([name,c],i)=>({id:"t"+(i+1),name,color:THREAD_COLORS[c],scenes:[],note:""})),
    notes:"",
    seq: 100,
  };
}

/* ================= state ================= */
let S = blankMap();
let undoStack = [], redoStack = [], lastMutAt = 0, lastMutKey = "";
let sel = null;            // {kind:"scene"|"link", id}
let hoverId = null;
let threadEdit = null;     // thread id in membership-edit mode
let newKind = "main";
let armedDelete = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + (++S.seq) + Math.random().toString(36).slice(2,5);
const clone = o => JSON.parse(JSON.stringify(o));

function order(){ const out=[]; S.acts.forEach((a,ai)=>a.scenes.forEach(id=>out.push({id,ai}))); return out; }
function numbers(){ const m={}; order().forEach((o,i)=>m[o.id]=i+1); return m; }
function actOf(id){ return S.acts.findIndex(a=>a.scenes.includes(id)); }
function sceneColor(id){ const s=S.scenes[id]; return s&&s.type==="choice" ? "#ff5d7a" : (S.acts[actOf(id)]||{}).color; }

/* mutate: snapshot for undo; rapid edits to the same field coalesce */
function mutate(fn, key){
  const now = Date.now();
  if(!key || key!==lastMutKey || now-lastMutAt>1200){ undoStack.push(clone(S)); if(undoStack.length>150) undoStack.shift(); redoStack=[]; }
  lastMutAt = now; lastMutKey = key||"";
  fn();
  S.updatedAt = now;
  changed();
}
function changed(opts={}){
  renderBoard(); renderThreads(); renderStats(); syncHistoryBtns();
  if(opts.panel) renderPanel();
  persistLocal(true); scheduleSave();
}
function undo(){ if(!undoStack.length) return; redoStack.push(clone(S)); S=undoStack.pop(); lastMutKey=""; afterSwap(); }
function redo(){ if(!redoStack.length) return; undoStack.push(clone(S)); S=redoStack.pop(); lastMutKey=""; afterSwap(); }
function afterSwap(){
  S.updatedAt = Date.now();
  if(sel && sel.kind==="scene" && !S.scenes[sel.id]) sel=null;
  if(sel && sel.kind==="link" && !S.links.find(l=>l.id===sel.id)) sel=null;
  if(threadEdit && !S.threads.find(t=>t.id===threadEdit)) threadEdit=null;
  renderAll(); persistLocal(true); scheduleSave();
}
function syncHistoryBtns(){ $("#undo").disabled=!undoStack.length; $("#redo").disabled=!redoStack.length; }

/* ================= rendering: header ================= */
function autosize(el){ el.style.height="auto"; el.style.height=el.scrollHeight+"px"; }
function renderMeta(){
  for(const k of ["title","subtitle","tagline","quote","aside"]){ const el=$("#m-"+k); if(document.activeElement!==el) el.value=S.meta[k]||""; if(el.tagName==="TEXTAREA") autosize(el); }
  if(document.activeElement!==$("#notes")) $("#notes").value=S.notes||"";
  document.title = S.meta.title || "Story map";
}
function renderStats(){
  const n=order().length, filled=Object.values(S.scenes).filter(s=>s.title.trim()).length;
  const maj=Object.values(S.scenes).filter(s=>s.type==="major").length, ch=Object.values(S.scenes).filter(s=>s.type==="choice").length;
  $("#stats").textContent = `${n} scenes · ${filled} named · ${maj} major · ${ch} choices · ${S.links.length} links · ${S.threads.length} threads`;
}

/* ================= rendering: board ================= */
function cardGlyph(s){
  if(s.type==="major") return ICON.star();
  if(s.type==="choice") return ICON.diamond();
  if(s.dog) return ICON.paw();
  if(s.clue) return ICON.clue();
  return "";
}
function renderBoard(){
  const nums = numbers();
  const te = threadEdit && S.threads.find(t=>t.id===threadEdit);
  const linked = hoverId ? new Set(S.links.filter(l=>l.from===hoverId||l.to===hoverId).flatMap(l=>[l.from,l.to])) : null;
  let h = "";
  S.acts.forEach((a,ai)=>{
    h += `<section class="act" style="--c:${a.color}" data-act="${ai}">
      <div class="act-head">
        ${a.scenes.length?"":`<button class="act-x" data-del-act="${ai}" title="Remove this empty act" aria-label="Remove act">×</button>`}
        <div class="act-kicker">Act ${ROMAN[ai]||ai+1}</div>
        <input class="bare act-name" data-act-name="${ai}" value="${esc(a.name)}" aria-label="Act ${ai+1} name" spellcheck="false">
        <input class="bare act-sub" data-act-sub="${ai}" value="${esc(a.subtitle)}" aria-label="Act ${ai+1} subtitle" spellcheck="false">
      </div>
      <ol class="scenes">`;
    a.scenes.forEach(id=>{
      const s = S.scenes[id];
      const threads = S.threads.filter(t=>t.scenes.includes(id));
      const extras = [];
      if(s.dog && (s.type!=="normal")) extras.push(ICON.paw());
      if(s.clue && (s.type!=="normal"||s.dog)) extras.push(ICON.clue());
      threads.forEach(t=>extras.push(`<span class="tdot" style="--tc:${t.color}" title="${esc(t.name)}"></span>`));
      let cls = "card";
      if(s.type==="choice") cls+=" choice";
      if(sel&&sel.kind==="scene"&&sel.id===id) cls+=" sel";
      if(te){ if(te.scenes.includes(id)) cls+=" member"; else cls+=" dim"; }
      else if(linked && linked.size && !linked.has(id) && id!==hoverId) cls+=" dim";
      h += `<li class="${cls}" data-id="${id}" data-col="${ai}" tabindex="0" ${te?`style="--tc:${te.color}"`:""} aria-label="Scene ${nums[id]}${s.title?": "+esc(s.title):""}">
        <span class="num">${nums[id]}</span>
        <span class="glyph">${cardGlyph(s)}</span>
        <span class="body"><span class="t${s.title?"":" empty"}">${s.title?esc(s.title):"Untitled scene"}</span>${s.desc?`<span class="d">${esc(s.desc)}</span>`:""}</span>
        <span class="extras">${extras.join("")}</span>
        <span class="handle" data-handle="${id}" title="Drag onto another scene to link"></span>
      </li>`;
    });
    h += `</ol><button class="add-scene" data-add-scene="${ai}">+ Add scene</button></section>`;
  });
  h += `<button class="add-act" id="addAct">+ Add act</button><svg id="links" aria-hidden="false"></svg>`;
  const scroller = $("#boardScroll"), sl = scroller.scrollLeft;
  const board = $("#board");
  const focusedAct = document.activeElement && (document.activeElement.dataset.actName ?? document.activeElement.dataset.actSub);
  if(focusedAct!==undefined && board.contains(document.activeElement)) { renderLinks(); return; } // don't clobber an act title being typed
  board.innerHTML = h;
  scroller.scrollLeft = sl;
  renderLinks();
}

function renderLinks(){
  const board = $("#board"), svg = $("#links");
  if(!svg) return;
  const br = board.getBoundingClientRect();
  const P = {};
  board.querySelectorAll(".card").forEach(el=>{
    const r = el.getBoundingClientRect();
    P[el.dataset.id] = {l:r.left-br.left, r:r.right-br.left, t:r.top-br.top, b:r.bottom-br.top, h:r.height, cy:(r.top+r.bottom)/2-br.top, col:+el.dataset.col};
  });
  svg.setAttribute("width", board.scrollWidth); svg.setAttribute("height", board.scrollHeight);
  svg.setAttribute("viewBox", `0 0 ${board.scrollWidth} ${board.scrollHeight}`);

  // decide sides, then spread endpoints that share a side
  const ends = {};
  const plan = S.links.filter(l=>P[l.from]&&P[l.to]).map(l=>{
    const a=P[l.from], b=P[l.to];
    let fs, ts;
    if(b.col>a.col){fs="R";ts="L";} else if(b.col<a.col){fs="L";ts="R";} else {fs="L";ts="L";}
    const p={l,a,b,fs,ts};
    (ends[l.from+fs] ||= []).push({p,end:"f",oy:b.cy});
    (ends[l.to+ts] ||= []).push({p,end:"t",oy:a.cy});
    return p;
  });
  for(const k in ends){
    const list = ends[k].sort((x,y)=>x.oy-y.oy), n=list.length;
    list.forEach((e,i)=>{ const c=e.end==="f"?e.p.a:e.p.b; const step=Math.min(9,(c.h-14)/Math.max(1,n)); e.p[e.end+"y"] = c.cy + (i-(n-1)/2)*step; });
  }
  const markers = new Set();
  let paths = "";
  const nums = numbers();
  const te = !!threadEdit;
  plan.forEach(p=>{
    const {l,a,b,fs,ts} = p;
    const color = l.color || KINDS[l.kind].color;
    markers.add(color);
    const sx = fs==="R"?a.r:a.l, ex = ts==="R"?b.r:b.l, sy=p.fy, ey=p.ty;
    let d, c1x, c2x;
    if(fs==="L"&&ts==="L"){
      const span = Math.abs(nums[l.to]-nums[l.from]);
      const k = 22 + Math.min(span,9)*3.2;
      c1x = sx-k; c2x = ex-k;
    } else {
      const dx = Math.max(36, Math.abs(ex-sx)*.42), dir = fs==="R"?1:-1;
      c1x = sx+dir*dx; c2x = ex-dir*dx;
    }
    const exAdj = ex + (ts==="R"?7:-7);
    d = `M${sx.toFixed(1)} ${sy.toFixed(1)} C${c1x.toFixed(1)} ${sy.toFixed(1)} ${c2x.toFixed(1)} ${ey.toFixed(1)} ${exAdj.toFixed(1)} ${ey.toFixed(1)}`;
    let cls = "lk";
    if(sel&&sel.kind==="link"&&sel.id===l.id) cls+=" sel";
    if(te || (hoverId && l.from!==hoverId && l.to!==hoverId)) cls+=" dim";
    const mx=(sx+3*c1x+3*c2x+exAdj)/8, my=(sy+3*sy+3*ey+ey)/8;
    paths += `<g class="${cls}" data-link="${l.id}" style="color:${color}">
      <path class="vis" d="${d}" stroke="${color}" ${KINDS[l.kind].dash?`stroke-dasharray="${KINDS[l.kind].dash}"`:""} marker-end="url(#ah-${color.slice(1)})"/>
      <path class="hit" d="${d}"><title>${nums[l.from]} → ${nums[l.to]} · ${KINDS[l.kind].label}${l.label?" · "+esc(l.label):""}</title></path>
      ${l.label?`<text x="${mx.toFixed(1)}" y="${(my-5).toFixed(1)}" text-anchor="middle" fill="${color}">${esc(l.label)}</text>`:""}
    </g>`;
  });
  let defs = "<defs>";
  markers.add(KINDS.main.color);
  markers.forEach(c=>{ defs += `<marker id="ah-${c.slice(1)}" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="${c}"/></marker>`; });
  defs += "</defs>";
  svg.innerHTML = defs + paths + `<path class="tmp" id="tmpLine" d="" hidden/>`;
}

/* ================= rendering: threads + key ================= */
function renderThreads(){
  const nums = numbers(), total = Math.max(2, order().length);
  $("#threads").innerHTML = S.threads.map(t=>{
    const ids = t.scenes.filter(id=>nums[id]).sort((a,b)=>nums[a]-nums[b]);
    const ticks = ids.map(id=>{ const pct = ((nums[id]-1)/(total-1))*100; return `<button class="tick" style="left:${pct}%" data-goto="${id}" title="Scene ${nums[id]}${S.scenes[id].title?": "+esc(S.scenes[id].title):""}"><i></i>${nums[id]}</button>`; }).join("");
    const editing = threadEdit===t.id;
    return `<div class="thread${editing?" editing":""}" style="--tc:${t.color}" data-thread="${t.id}">
      <div class="tname"><button class="swatch" data-tcolor="${t.id}" title="Change colour" aria-label="Change colour"></button><input class="bare" data-tname="${t.id}" value="${esc(t.name)}" aria-label="Thread name" spellcheck="false"></div>
      <div class="track">${ticks || `<span class="empty">No scenes yet. Use Edit.</span>`}</div>
      <input class="bare tnote" data-tnote="${t.id}" value="${esc(t.note)}" placeholder="What is this thread?" aria-label="Thread note">
      <div class="tactions"><button class="icon-btn" data-tedit="${t.id}" aria-pressed="${editing}">${editing?"Done":"Edit"}</button><button class="icon-btn" data-tdel="${t.id}" title="Delete thread" aria-label="Delete thread">${armedDelete==="t"+t.id?"Sure?":"×"}</button></div>
    </div>`;
  }).join("");
  const te = threadEdit && S.threads.find(t=>t.id===threadEdit);
  $("#bannerSlot").innerHTML = te ? `<div class="banner" style="--tc:${te.color}"><span>Editing thread <b>${esc(te.name)}</b>. Click scenes on the map to add or remove them.</span><button class="btn" data-tedit="${te.id}">Done</button></div>` : "";
}
function renderKey(){
  const ln = (k)=>`<svg class="ln" viewBox="0 0 38 10"><defs><marker id="k-${k}" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="${KINDS[k].color}"/></marker></defs><path d="M1 5H30" stroke="${KINDS[k].color}" stroke-width="2" fill="none" ${KINDS[k].dash?`stroke-dasharray="${KINDS[k].dash}"`:""} marker-end="url(#k-${k})"/></svg>`;
  $("#key").innerHTML = `
    <li>${ICON.star()} Major scene (set-piece / revelation)</li>
    <li>${ICON.diamond()} Choice (take one, lose others)</li>
    <li>${ICON.paw()} Dog appearance (may be interactive)</li>
    <li>${ICON.clue()} Significant clue / notebook entry</li>
    <li>${ln("main")} Main path (always connects)</li>
    <li>${ln("conditional")} Conditional route (item / state dependent)</li>
    <li>${ln("optional")} Optional / secret route</li>
    <li class="muted">Link colours are yours to assign, e.g. one per key item.</li>`;
  $("#kindSeg").innerHTML = Object.entries(KINDS).map(([k,v])=>`<button data-kind="${k}" aria-pressed="${k===newKind}"><svg class="linesample" viewBox="0 0 26 8"><path d="M1 4H25" stroke="${v.color}" stroke-width="2" ${v.dash?`stroke-dasharray="${v.dash}"`:""}/></svg>${v.label.split(" ")[0]}</button>`).join("");
}

/* ================= rendering: side panel ================= */
function renderPanel(){
  const panel = $("#panel");
  if(!sel){ panel.hidden = true; return; }
  const nums = numbers();
  if(sel.kind==="scene"){
    const id = sel.id, s = S.scenes[id], ai = actOf(id), a = S.acts[ai];
    const out = S.links.filter(l=>l.from===id), inc = S.links.filter(l=>l.to===id);
    const li = (l, other, dir) => `<li><span style="color:${l.color||KINDS[l.kind].color}">${dir}</span>
        <button class="go" data-goto="${other}">${nums[other]} · ${esc(S.scenes[other].title||"Untitled")}</button>
        <button class="pill" style="color:${l.color||KINDS[l.kind].color};background:none" data-openlink="${l.id}" title="Edit link">${l.kind}</button>
        <button class="icon-btn" data-dellink="${l.id}" aria-label="Delete link">×</button></li>`;
    const idx = a.scenes.indexOf(id);
    panel.innerHTML = `<header style="--pc:${sceneColor(id)}"><span class="pnum">${nums[id]}</span><h3>Scene ${nums[id]}<small>Act ${ROMAN[ai]||ai+1} · ${esc(a.name)}</small></h3><button class="icon-btn" id="pclose" aria-label="Close">✕</button></header>
      <div class="pbody">
        <div class="field"><label for="f-title">Title</label><input class="inp" id="f-title" value="${esc(s.title)}" placeholder="The Waiting Room"></div>
        <div class="field"><label for="f-desc">One-line hook</label><input class="inp" id="f-desc" value="${esc(s.desc)}" placeholder="Three doors. The journey begins."></div>
        <div class="field"><span class="flabel">Scene type</span>
          <div class="seg" id="f-type">${[["normal","Standard",""],["major","Major",ICON.star()],["choice","Choice",ICON.diamond()]].map(([k,lab,ic])=>`<button data-type="${k}" aria-pressed="${s.type===k}">${ic?ic.replace("<svg","<svg width='14' height='14'"):""}${lab}</button>`).join("")}</div></div>
        <div class="checks">
          <label class="chk"><input type="checkbox" id="f-dog" ${s.dog?"checked":""}>${ICON.paw().replace("<svg","<svg width='14' height='14'")} Dog appears</label>
          <label class="chk"><input type="checkbox" id="f-clue" ${s.clue?"checked":""}>${ICON.clue().replace("<svg","<svg width='14' height='14'")} Clue / notebook entry</label>
        </div>
        <div class="field"><span class="flabel">Threads</span>
          <div class="checks">${S.threads.map(t=>`<button class="chip" style="--tc:${t.color}" data-tchip="${t.id}" aria-pressed="${t.scenes.includes(id)}"><i></i>${esc(t.name)}</button>`).join("") || `<span class="muted">No threads yet.</span>`}</div></div>
        <div class="field"><label for="f-notes">Notes</label><textarea class="inp" id="f-notes" placeholder="What happens, what the player learns, items found, how it changes on a revisit…">${esc(s.notes)}</textarea></div>
        <hr class="divider">
        <div class="field"><span class="flabel">Leads to</span>${out.length?`<ul class="links-list">${out.map(l=>li(l,l.to,"→")).join("")}</ul>`:`<span class="muted">No outgoing links besides the default flow.</span>`}</div>
        <div class="field"><span class="flabel">Reached from</span>${inc.length?`<ul class="links-list">${inc.map(l=>li(l,l.from,"←")).join("")}</ul>`:`<span class="muted">No incoming links.</span>`}</div>
        <div class="field"><label for="f-linkto">Add link to scene number</label>
          <div class="row"><input class="inp" id="f-linkto" type="number" min="1" max="${order().length}" style="width:90px">
          <select class="inp" id="f-linkkind" style="width:auto">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${k===newKind?"selected":""}>${v.label}</option>`).join("")}</select>
          <button class="btn" id="f-addlink">Add</button></div><span class="muted" id="f-linkmsg"></span></div>
        <hr class="divider">
        <div class="field"><span class="flabel">Position</span>
          <div class="row"><button class="btn" id="f-up" ${idx===0?"disabled":""}>↑ Up</button><button class="btn" id="f-down" ${idx===a.scenes.length-1?"disabled":""}>↓ Down</button>
          <select class="inp" id="f-act" style="width:auto" aria-label="Move to act">${S.acts.map((x,i)=>`<option value="${i}" ${i===ai?"selected":""}>Act ${ROMAN[i]||i+1} · ${esc(x.name)}</option>`).join("")}</select></div></div>
        <div class="row"><button class="btn danger${armedDelete===id?" armed":""}" id="f-delete">${armedDelete===id?"Click again to delete scene "+nums[id]:"Delete scene"}</button></div>
      </div>`;
  } else {
    const l = S.links.find(x=>x.id===sel.id); if(!l){ sel=null; panel.hidden=true; return; }
    const color = l.color||KINDS[l.kind].color;
    panel.innerHTML = `<header style="--pc:${color}"><span class="pnum" style="font-size:15px">⇢</span><h3>Link ${nums[l.from]} → ${nums[l.to]}<small>${KINDS[l.kind].label}</small></h3><button class="icon-btn" id="pclose" aria-label="Close">✕</button></header>
      <div class="pbody">
        <ul class="links-list">
          <li><span class="muted">From</span><button class="go" data-goto="${l.from}">${nums[l.from]} · ${esc(S.scenes[l.from].title||"Untitled")}</button><span></span><span></span></li>
          <li><span class="muted">To</span><button class="go" data-goto="${l.to}">${nums[l.to]} · ${esc(S.scenes[l.to].title||"Untitled")}</button><span></span><span></span></li>
        </ul>
        <div class="field"><span class="flabel">Route type</span>
          <div class="seg" id="l-kind">${Object.entries(KINDS).map(([k,v])=>`<button data-lkind="${k}" aria-pressed="${l.kind===k}">${v.label}</button>`).join("")}</div>
          <span class="muted">${KINDS[l.kind].desc}</span></div>
        <div class="field"><span class="flabel">Colour</span>
          <div class="colors">${LINK_COLORS.map(c=>`<button style="--sw:${c}" data-lcolor="${c}" aria-pressed="${color===c}" aria-label="Colour ${c}"></button>`).join("")}</div></div>
        <div class="field"><label for="l-label">Label on the map</label><input class="inp" id="l-label" value="${esc(l.label)}" placeholder="needs the red key"></div>
        <div class="row"><button class="btn" id="l-reverse">⇄ Reverse direction</button><button class="btn danger" id="l-delete">Delete link</button></div>
      </div>`;
  }
  panel.hidden = false;
}
function renderAll(){ renderMeta(); renderKey(); renderBoard(); renderThreads(); renderStats(); renderPanel(); syncHistoryBtns(); }

/* ================= actions ================= */
function select(s){ sel = s; armedDelete=null; renderBoard(); renderPanel(); }
function gotoScene(id){
  select({kind:"scene",id});
  const el = document.querySelector(`.card[data-id="${id}"]`);
  if(el){ el.scrollIntoView({behavior:"smooth",block:"center",inline:"center"}); el.focus({preventScroll:true}); }
}
function addLink(from,to,kind){
  if(from===to) return "A scene can't link to itself.";
  if(S.links.some(l=>l.from===from&&l.to===to)) return "Those scenes are already linked.";
  const l = {id:uid("l"),from,to,kind,color:KINDS[kind].color,label:""};
  mutate(()=>S.links.push(l));
  return l;
}
function deleteScene(id){
  mutate(()=>{
    S.acts.forEach(a=>a.scenes=a.scenes.filter(x=>x!==id));
    delete S.scenes[id];
    S.links = S.links.filter(l=>l.from!==id&&l.to!==id);
    S.threads.forEach(t=>t.scenes=t.scenes.filter(x=>x!==id));
  });
  sel=null; renderPanel();
}
function toggleThread(tid,id){
  const t = S.threads.find(x=>x.id===tid); if(!t) return;
  mutate(()=>{ t.scenes = t.scenes.includes(id) ? t.scenes.filter(x=>x!==id) : [...t.scenes,id]; });
}

/* ================= events ================= */
const board = $("#board");
board.addEventListener("click", e=>{
  const hit = e.target.closest("[data-link]");
  if(e.target.classList.contains("hit") && hit){ select({kind:"link",id:hit.dataset.link}); return; }
  const addS = e.target.closest("[data-add-scene]");
  if(addS){ const ai=+addS.dataset.addScene, id=uid("s"); mutate(()=>{ S.scenes[id]={title:"",desc:"",type:"normal",dog:false,clue:false,notes:""}; S.acts[ai].scenes.push(id); }); gotoScene(id); setTimeout(()=>$("#f-title")?.focus(),50); return; }
  if(e.target.id==="addAct"){ mutate(()=>S.acts.push({id:uid("a"),name:"New act",subtitle:"",color:ACT_COLORS[S.acts.length%ACT_COLORS.length],scenes:[]})); return; }
  const delA = e.target.closest("[data-del-act]");
  if(delA){ const ai=+delA.dataset.delAct; if(!S.acts[ai].scenes.length) mutate(()=>S.acts.splice(ai,1)); return; }
  const card = e.target.closest(".card");
  if(card && !e.target.closest(".handle")){
    if(threadEdit){ toggleThread(threadEdit, card.dataset.id); return; }
    select({kind:"scene",id:card.dataset.id});
  }
});
board.addEventListener("keydown", e=>{
  const card = e.target.closest?.(".card");
  if(card && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); card.click(); }
});
board.addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.actName!==undefined) mutate(()=>S.acts[+t.dataset.actName].name=t.value, "an"+t.dataset.actName);
  if(t.dataset.actSub!==undefined) mutate(()=>S.acts[+t.dataset.actSub].subtitle=t.value, "as"+t.dataset.actSub);
});
board.addEventListener("focusout", e=>{ if(e.target.dataset && (e.target.dataset.actName!==undefined||e.target.dataset.actSub!==undefined)) setTimeout(renderBoard,0); });
board.addEventListener("pointerover", e=>{
  if(drag||threadEdit) return;
  const card = e.target.closest(".card"); const id = card?card.dataset.id:null;
  if(id!==hoverId){ hoverId=id; applyHover(); }
});
board.addEventListener("pointerleave", ()=>{ if(hoverId){ hoverId=null; applyHover(); } });
function applyHover(){
  // lightweight: toggle classes without re-rendering
  const linked = hoverId ? new Set(S.links.filter(l=>l.from===hoverId||l.to===hoverId).flatMap(l=>[l.from,l.to])) : null;
  if(!threadEdit) board.querySelectorAll(".card").forEach(el=>el.classList.toggle("dim", !!linked && !linked.has(el.dataset.id) && el.dataset.id!==hoverId && linked.size>0));
  board.querySelectorAll(".lk").forEach(g=>{ const l=S.links.find(x=>x.id===g.dataset.link); g.classList.toggle("dim", !!threadEdit || (!!hoverId && l && l.from!==hoverId && l.to!==hoverId)); });
}

/* drag-to-link */
let drag = null;
board.addEventListener("pointerdown", e=>{
  const h = e.target.closest(".handle"); if(!h) return;
  e.preventDefault(); h.setPointerCapture(e.pointerId);
  drag = {from:h.dataset.handle, pid:e.pointerId, target:null};
});
board.addEventListener("pointermove", e=>{
  if(!drag) return;
  const br = board.getBoundingClientRect();
  const fromEl = board.querySelector(`.card[data-id="${drag.from}"]`).getBoundingClientRect();
  const sx = fromEl.right-br.left, sy=(fromEl.top+fromEl.bottom)/2-br.top, ex=e.clientX-br.left, ey=e.clientY-br.top;
  const tmp = $("#tmpLine"); tmp.removeAttribute("hidden");
  tmp.setAttribute("d", `M${sx} ${sy} C${sx+60} ${sy} ${ex-60} ${ey} ${ex} ${ey}`);
  const under = document.elementFromPoint(e.clientX,e.clientY)?.closest(".card");
  const tid = under && under.dataset.id!==drag.from ? under.dataset.id : null;
  if(tid!==drag.target){ board.querySelector(".droptarget")?.classList.remove("droptarget"); if(tid) under.classList.add("droptarget"); drag.target=tid; }
  // auto-scroll the board horizontally near its edges
  const sr = $("#boardScroll").getBoundingClientRect();
  if(e.clientX > sr.right-40) $("#boardScroll").scrollLeft += 14; else if(e.clientX < sr.left+40) $("#boardScroll").scrollLeft -= 14;
});
function endDrag(){
  if(!drag) return;
  const {from,target} = drag; drag=null;
  $("#tmpLine")?.setAttribute("hidden","");
  board.querySelector(".droptarget")?.classList.remove("droptarget");
  if(target){ const r = addLink(from,target,newKind); if(typeof r==="object") select({kind:"link",id:r.id}); }
}
board.addEventListener("pointerup", endDrag);
board.addEventListener("pointercancel", ()=>{ drag=null; $("#tmpLine")?.setAttribute("hidden",""); });

/* header + notes */
for(const k of ["title","subtitle","tagline","quote","aside"]){
  $("#m-"+k).addEventListener("input", e=>{ mutate(()=>S.meta[k]=e.target.value, "m"+k); if(e.target.tagName==="TEXTAREA") autosize(e.target); if(k==="title") document.title=e.target.value||"Story map"; });
}
$("#notes").addEventListener("input", e=>mutate(()=>S.notes=e.target.value, "notes"));

/* toolbar */
$("#undo").onclick = undo; $("#redo").onclick = redo;
$("#kindSeg").addEventListener("click", e=>{ const b=e.target.closest("[data-kind]"); if(b){ newKind=b.dataset.kind; renderKey(); } });
let resetTimer;
$("#reset").onclick = e=>{
  const b = e.currentTarget;
  if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="Click again to wipe the map"; clearTimeout(resetTimer); resetTimer=setTimeout(()=>{b.classList.remove("armed");b.textContent="Reset to blank";},3500); return; }
  b.classList.remove("armed"); b.textContent="Reset to blank";
  undoStack.push(clone(S)); redoStack=[]; const seqKeep=S.seq; S = blankMap(); S.seq=seqKeep; S.updatedAt=Date.now(); sel=null; threadEdit=null; renderAll(); persistLocal(true); scheduleSave();
  flash("Map reset. Undo brings it back.");
};
$("#export").onclick = async ()=>{
  const data = JSON.stringify(S,null,2), name = (S.meta.title||"story-map").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+".json";
  const dl = await capability("downloads");
  if(dl){ try{ await dl.save({filename:name,data}); return; }catch(err){ if(err&&err.code==="declined") return; } }
  try{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([data],{type:"application/json"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }catch{}
  try{ await navigator.clipboard.writeText(data); flash("JSON copied to clipboard."); }catch{}
};
$("#importFile").onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ const d=JSON.parse(r.result); validate(d); undoStack.push(clone(S)); redoStack=[]; S=d; S.updatedAt=Date.now(); sel=null; threadEdit=null; renderAll(); persistLocal(true); scheduleSave(); flash("Imported "+f.name+"."); }catch(err){ flash("That file isn't a story map export: "+err.message, true); } e.target.value=""; };
  r.readAsText(f);
};
function validate(d){
  if(!d||!Array.isArray(d.acts)||typeof d.scenes!=="object"||!Array.isArray(d.links)||!Array.isArray(d.threads)) throw new Error("missing acts, scenes, links or threads");
  d.meta ||= {}; d.notes ??= ""; d.seq ??= 1000;
  d.acts.forEach(a=>a.scenes=a.scenes.filter(id=>d.scenes[id]));
  d.links = d.links.filter(l=>d.scenes[l.from]&&d.scenes[l.to]&&KINDS[l.kind]);
}

/* threads */
$("#threads").addEventListener("click", e=>{
  const t=e.target;
  const g = t.closest("[data-goto]"); if(g){ gotoScene(g.dataset.goto); return; }
  const ed = t.closest("[data-tedit]"); if(ed){ toggleThreadEdit(ed.dataset.tedit); return; }
  const sw = t.closest("[data-tcolor]"); if(sw){ const th=S.threads.find(x=>x.id===sw.dataset.tcolor); mutate(()=>th.color=THREAD_COLORS[(THREAD_COLORS.indexOf(th.color)+1)%THREAD_COLORS.length]); return; }
  const del = t.closest("[data-tdel]");
  if(del){ const id=del.dataset.tdel; if(armedDelete!=="t"+id){ armedDelete="t"+id; renderThreads(); return; } armedDelete=null; if(threadEdit===id) threadEdit=null; mutate(()=>S.threads=S.threads.filter(x=>x.id!==id)); renderPanel(); }
});
$("#threads").addEventListener("input", e=>{
  const t=e.target;
  if(t.dataset.tname){ const th=S.threads.find(x=>x.id===t.dataset.tname); mutateQuiet(()=>th.name=t.value, "tn"+th.id); }
  if(t.dataset.tnote){ const th=S.threads.find(x=>x.id===t.dataset.tnote); mutateQuiet(()=>th.note=t.value, "tt"+th.id); }
});
// text edits inside the threads list: record undo + save, but don't rebuild the list under the cursor
function mutateQuiet(fn,key){
  const now=Date.now();
  if(key!==lastMutKey || now-lastMutAt>1200){ undoStack.push(clone(S)); redoStack=[]; }
  fn(); lastMutAt=now; lastMutKey=key; S.updatedAt=now;
  const b=$("#bannerSlot b"); if(b && threadEdit) b.textContent=S.threads.find(x=>x.id===threadEdit)?.name||"";
  renderBoard(); renderStats(); syncHistoryBtns(); persistLocal(true); scheduleSave();
  if(sel&&sel.kind==="scene") renderPanel();
}
$("#bannerSlot").addEventListener("click", e=>{ const ed=e.target.closest("[data-tedit]"); if(ed) toggleThreadEdit(ed.dataset.tedit); });
function toggleThreadEdit(id){ threadEdit = threadEdit===id ? null : id; hoverId=null; if(threadEdit){ sel=null; renderPanel(); } renderThreads(); renderBoard(); if(threadEdit) $("#boardScroll").scrollIntoView({behavior:"smooth",block:"start"}); }
$("#addThread").onclick = ()=>{ const id=uid("t"); mutate(()=>S.threads.push({id,name:"New thread",color:THREAD_COLORS[S.threads.length%THREAD_COLORS.length],scenes:[],note:""})); const inp=document.querySelector(`[data-tname="${id}"]`); inp?.focus(); inp?.select(); };

/* panel */
const panel = $("#panel");
panel.addEventListener("click", e=>{
  const t=e.target;
  if(t.closest("#pclose")){ select(null); return; }
  const g=t.closest("[data-goto]"); if(g){ gotoScene(g.dataset.goto); return; }
  const ol=t.closest("[data-openlink]"); if(ol){ select({kind:"link",id:ol.dataset.openlink}); return; }
  const dl=t.closest("[data-dellink]"); if(dl){ mutate(()=>S.links=S.links.filter(l=>l.id!==dl.dataset.dellink)); renderPanel(); return; }
  if(sel?.kind==="scene"){
    const id=sel.id, s=S.scenes[id];
    const ty=t.closest("[data-type]"); if(ty){ mutate(()=>s.type=ty.dataset.type); renderPanel(); return; }
    const ch=t.closest("[data-tchip]"); if(ch){ toggleThread(ch.dataset.tchip,id); renderPanel(); return; }
    if(t.closest("#f-addlink")){
      const n=+$("#f-linkto").value, target=order()[n-1];
      if(!target){ $("#f-linkmsg").textContent=`Enter a scene number from 1 to ${order().length}.`; return; }
      const r=addLink(id,target.id,$("#f-linkkind").value);
      if(typeof r==="string"){ $("#f-linkmsg").textContent=r; return; }
      renderPanel(); return;
    }
    if(t.closest("#f-up")||t.closest("#f-down")){
      const a=S.acts[actOf(id)], i=a.scenes.indexOf(id), j=i+(t.closest("#f-up")?-1:1);
      mutate(()=>{ [a.scenes[i],a.scenes[j]]=[a.scenes[j],a.scenes[i]]; }); renderPanel(); return;
    }
    if(t.closest("#f-delete")){ if(armedDelete!==id){ armedDelete=id; renderPanel(); return; } armedDelete=null; deleteScene(id); return; }
  }
  if(sel?.kind==="link"){
    const l=S.links.find(x=>x.id===sel.id);
    const k=t.closest("[data-lkind]"); if(k){ mutate(()=>{ const wasDefault = !l.color || l.color===KINDS[l.kind].color; l.kind=k.dataset.lkind; if(wasDefault) l.color=KINDS[l.kind].color; }); renderPanel(); return; }
    const c=t.closest("[data-lcolor]"); if(c){ mutate(()=>l.color=c.dataset.lcolor); renderPanel(); return; }
    if(t.closest("#l-reverse")){ mutate(()=>{ [l.from,l.to]=[l.to,l.from]; }); renderPanel(); return; }
    if(t.closest("#l-delete")){ mutate(()=>S.links=S.links.filter(x=>x.id!==l.id)); select(null); }
  }
});
panel.addEventListener("input", e=>{
  const t=e.target;
  if(sel?.kind==="scene"){
    const s=S.scenes[sel.id];
    if(t.id==="f-title") mutate(()=>s.title=t.value,"ft"+sel.id);
    if(t.id==="f-desc") mutate(()=>s.desc=t.value,"fd"+sel.id);
    if(t.id==="f-notes") mutate(()=>s.notes=t.value,"fn"+sel.id);
  }
  if(sel?.kind==="link" && t.id==="l-label"){ const l=S.links.find(x=>x.id===sel.id); mutate(()=>l.label=t.value,"ll"+l.id); }
});
panel.addEventListener("change", e=>{
  const t=e.target;
  if(sel?.kind!=="scene") return;
  const id=sel.id, s=S.scenes[id];
  if(t.id==="f-dog") mutate(()=>s.dog=t.checked);
  if(t.id==="f-clue") mutate(()=>s.clue=t.checked);
  if(t.id==="f-act"){ const to=+t.value; mutate(()=>{ S.acts.forEach(a=>a.scenes=a.scenes.filter(x=>x!==id)); S.acts[to].scenes.push(id); }); renderPanel(); gotoScene(id); }
});
panel.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="f-linkto") $("#f-addlink").click(); });

document.addEventListener("keydown", e=>{
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||"");
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && !typing){ e.preventDefault(); e.shiftKey?redo():undo(); }
  else if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="y" && !typing){ e.preventDefault(); redo(); }
  else if(e.key==="Escape"){ if(drag){ drag=null; $("#tmpLine")?.setAttribute("hidden",""); } else if(threadEdit){ toggleThreadEdit(threadEdit); } else if(sel){ select(null); } }
  else if((e.key==="Delete"||e.key==="Backspace") && !typing && sel?.kind==="link"){ mutate(()=>S.links=S.links.filter(x=>x.id!==sel.id)); select(null); }
});

new ResizeObserver(()=>renderLinks()).observe(board);
window.addEventListener("resize", ()=>renderLinks());
document.fonts?.ready.then(()=>renderLinks());

/* ================= persistence ================= */
let toastT;
function flash(msg, bad){ setStatus(bad?"error":($("#status").dataset.s), msg); clearTimeout(toastT); toastT=setTimeout(()=>setStatus(saveState.s, saveState.msg),4000); }
const saveState = {s:"local", msg:"Saved in this browser"};
function setStatus(s,msg){ const el=$("#status"); el.dataset.s=s; el.querySelector("span").textContent=msg; }
function status(s,msg){ saveState.s=s; saveState.msg=msg; setStatus(s,msg); }

function persistLocal(dirty){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({dirty, state:S})); }catch{}
}
const capCache = {};
function capability(name){
  if(!(name in capCache)) capCache[name] = (window.claude && typeof window.claude.use==="function") ? window.claude.use(name).catch(()=>null) : Promise.resolve(null);
  return capCache[name];
}
let artifactApi = null, canPublish = false, saveTimer = null, saving = false, pending = false, backoff = 2500;
function scheduleSave(){
  if(!canPublish){ status("local","Saved in this browser"); return; }
  status("saving","Unsaved changes…");
  clearTimeout(saveTimer); saveTimer = setTimeout(publishNow, backoff);
}
async function publishNow(retried){
  if(!canPublish) return;
  if(saving){ pending=true; return; }
  saving = true; status("saving","Saving…");
  try{
    await artifactApi.publish({"map.json":{content:JSON.stringify(S),contentType:"application/json"}});
    persistLocal(false); backoff=2500; status("saved","All changes saved");
  }catch(err){
    const code = err && err.code;
    if(code==="conflict"){ status("error","Someone else saved. Reloading their version; your draft stays in this browser."); }
    else if(code==="rate_limited"){ backoff=Math.min(backoff*2,30000); status("saving","Saving shortly…"); clearTimeout(saveTimer); saveTimer=setTimeout(publishNow,backoff); }
    else if(code==="upstream_error" && !retried){ saving=false; setTimeout(()=>publishNow(true), 1500+Math.random()*1500); return; }
    else if(["not_writer","not_granted","capability_disabled","capability_removed","not_declared","consent_required"].includes(code)){ canPublish=false; status("local","View only here · edits kept in this browser"); }
    else { status("error","Couldn't save. Your edits are kept in this browser; try Export JSON."); }
  }
  saving = false;
  if(pending){ pending=false; publishNow(); }
}

async function boot(){
  let loaded = null;
  try{ const r = await fetch("map.json",{cache:"no-store"}); if(r.ok){ const d = await r.json(); if(d){ validate(d); loaded=d; } } }catch{}
  let draft = null;
  try{ draft = JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch{}
  let draftWins = false;
  if(draft && draft.state){
    try{ validate(draft.state); if(!loaded || (draft.dirty && (draft.state.updatedAt||0) > (loaded.updatedAt||0))) draftWins = true; }catch{ draft=null; }
  }
  S = draftWins ? draft.state : (loaded || S);
  renderAll();
  status("local","Saved in this browser");
  artifactApi = await capability("artifact");
  if(artifactApi){
    canPublish = true;
    if(draftWins && loaded && draft.dirty) scheduleSave(); else status("saved","All changes saved");
  }
}
boot();
})();
</script>
