<title>Linterlude</title>
<meta name="description" content="A tiny Undertale-style RPG about a sock that fell through the lint trap.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  /* Layout: one 4:3 pixel screen centred on black; touch pad docks below it on phones. */
  :root {
    --bg: #07060b;
    --fg: #f4f1ff;
    --dim: #7d7697;
    --pad: rgba(255, 255, 255, 0.10);
    --pad-edge: rgba(255, 255, 255, 0.28);
    --ui: "Press Start 2P", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  body.touch.portrait #wrap { justify-content: flex-start; padding-top: max(8px, env(safe-area-inset-top, 0px)); }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; touch-action: none; outline: none; }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; height: 200px; pointer-events: none;
         padding-bottom: env(safe-area-inset-bottom, 0px);
         padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #pad button { pointer-events: auto; position: absolute; width: 58px; height: 58px; border-radius: 12px;
         background: var(--pad); border: 2px solid var(--pad-edge); color: var(--fg); font: 14px var(--ui); touch-action: none; }
  #pad button.on { background: rgba(255, 210, 63, 0.35); }
  #pad [data-k="up"]    { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 62px); bottom: 128px; }
  #pad [data-k="down"]  { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 62px); bottom: 12px; }
  #pad [data-k="left"]  { left: max(16px, env(safe-area-inset-left, 0px)); bottom: 70px; }
  #pad [data-k="right"] { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 124px); bottom: 70px; }
  #pad [data-k="z"] { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 0px); bottom: 90px; width: 70px; height: 70px; border-radius: 50%; }
  #pad [data-k="x"] { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 84px); bottom: 40px; width: 62px; height: 62px; border-radius: 50%; }
  #pad [data-k="c"] { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 10px); bottom: 12px; width: 50px; height: 40px; font-size: 10px; }
  body.touch.landscape #pad button { opacity: 0.55; }
</style>

<div id="wrap"><canvas id="game" width="640" height="480" tabindex="0" aria-label="Linterlude game screen"></canvas></div>
<div id="pad" hidden>
  <button data-k="up" aria-label="Up">▲</button>
  <button data-k="left" aria-label="Left">◀</button>
  <button data-k="right" aria-label="Right">▶</button>
  <button data-k="down" aria-label="Down">▼</button>
  <button data-k="z" aria-label="Confirm">Z</button>
  <button data-k="x" aria-label="Cancel">X</button>
  <button data-k="c" aria-label="Menu">MENU</button>
</div>

<script>
'use strict';
/* =====================================================================
   LINTERLUDE — Chapter 1: The Lint Trap
   A sock falls through the lint trap into the Lintlands.
   ===================================================================== */

const W = 640, H = 480, T = 32;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------------------------------------------------------- input */
const keys = {}, pressed = {};
const KEYMAP = {
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right', KeyZ: 'z', Enter: 'z', Space: 'z', KeyX: 'x', ShiftLeft: 'x',
  ShiftRight: 'x', Escape: 'x', KeyC: 'c', ControlLeft: 'c', KeyM: 'm',
};
function press(k) { if (!keys[k]) pressed[k] = true; keys[k] = true; }
addEventListener('keydown', e => {
  audio.unlock();
  if (G.scene === 'name' && G.nameScr && !G.nameScr.confirm) {
    if (/^[a-zA-Z]$/.test(e.key)) { nameAdd(e.key.toUpperCase()); e.preventDefault(); return; }
    if (e.key === 'Backspace') { nameDel(); e.preventDefault(); return; }
    if (e.key === 'Enter') { nameDone(); e.preventDefault(); return; }
  }
  const k = KEYMAP[e.code];
  if (k) { if (!e.repeat) press(k); keys[k] = true; e.preventDefault(); }
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const jp = k => !!pressed[k];
cv.addEventListener('pointerdown', () => { audio.unlock(); cv.focus(); if (['boot', 'title', 'intro', 'ending'].includes(G.scene)) press('z'); });
cv.addEventListener('pointerup', () => { keys.z = false; });

const isTouch = ('ontouchstart' in window) || matchMedia('(pointer: coarse)').matches;
const pad = document.getElementById('pad');
if (isTouch) {
  document.body.classList.add('touch');
  pad.hidden = false;
  pad.querySelectorAll('button').forEach(b => {
    const k = b.dataset.k;
    const on = e => { e.preventDefault(); audio.unlock(); press(k); b.classList.add('on'); };
    const off = e => { e.preventDefault(); keys[k] = false; b.classList.remove('on'); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  });
}
function resize() {
  const portrait = innerHeight > innerWidth;
  document.body.classList.toggle('portrait', portrait);
  document.body.classList.toggle('landscape', !portrait);
  let aw = innerWidth, ah = innerHeight;
  if (isTouch && portrait) ah -= 214;
  const s = Math.max(0.3, Math.min(aw / W, ah / H));
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', resize); resize();

/* ---------------------------------------------------------------- audio */
const audio = {
  ctx: null, master: null, muted: false,
  unlock() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.55;
        this.master.connect(this.ctx.destination);
      } catch (e) { return; }
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
};
function tone(freq, dur, type = 'square', vol = 0.08, slide = 0, delay = 0) {
  const a = audio.ctx; if (!a || audio.muted || G.skipping) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audio.master); o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol = 0.15, freq = 1200, delay = 0) {
  const a = audio.ctx; if (!a || audio.muted || G.skipping) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate, a.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = a.currentTime + delay;
  const s = a.createBufferSource(); s.buffer = noiseBuf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 0.8;
  const g = a.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(audio.master); s.start(t); s.stop(t + dur + 0.02);
}
const SFX = {
  blip: (p = 1) => tone(200 * p * (0.96 + Math.random() * 0.08), 0.045, 'square', 0.035),
  select: () => tone(700, 0.04, 'square', 0.05),
  confirm: () => { tone(523, 0.06, 'square', 0.06); tone(784, 0.09, 'square', 0.06, 0, 0.05); },
  buzz: () => tone(110, 0.22, 'sawtooth', 0.09),
  hurt: () => { tone(220, 0.16, 'sawtooth', 0.11, -140); noise(0.1, 0.1, 900); },
  hit: () => { noise(0.22, 0.25, 1600); tone(130, 0.2, 'square', 0.1, -70); },
  slash: () => noise(0.18, 0.2, 3500),
  zap: () => { for (let i = 0; i < 6; i++) tone(700 + Math.random() * 1400, 0.04, 'sawtooth', 0.06, 0, i * 0.03); noise(0.18, 0.14, 4500); },
  save: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'triangle', 0.1, 0, i * 0.08)),
  spare: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.1, 'square', 0.045, 0, i * 0.05)),
  heal: () => [440, 554, 659, 880].forEach((f, i) => tone(f, 0.12, 'triangle', 0.09, 0, i * 0.06)),
  encounter: () => { tone(880, 0.07, 'square', 0.09); tone(1320, 0.14, 'square', 0.09, 0, 0.07); },
  whump: () => { tone(85, 0.28, 'sine', 0.38, -45); noise(0.16, 0.22, 260); },
  thud: () => { tone(70, 0.32, 'sine', 0.42, -30); noise(0.22, 0.25, 220); },
  fall: () => tone(1000, 1.4, 'triangle', 0.07, -880),
  slurp: () => { tone(180, 0.55, 'sine', 0.22, 1100); noise(0.4, 0.08, 600); },
  slam: () => { noise(0.3, 0.4, 500); tone(60, 0.35, 'square', 0.18, -20); },
  ring: () => { for (let i = 0; i < 8; i++) tone(i % 2 ? 1250 : 1500, 0.05, 'square', 0.045, 0, i * 0.07); },
  sneeze: () => { noise(0.08, 0.1, 2000); noise(0.25, 0.25, 900, 0.12); tone(500, 0.2, 'square', 0.05, -300, 0.12); },
  snore: () => tone(90, 0.7, 'sawtooth', 0.05, 30),
  pop: () => tone(300, 0.08, 'sine', 0.2, 500),
  shatter: () => { noise(0.45, 0.3, 2800); tone(320, 0.4, 'square', 0.08, -260); },
  crack: () => { noise(0.1, 0.3, 3000); tone(150, 0.12, 'square', 0.1, -40); },
  dust: () => { noise(0.9, 0.12, 700); tone(400, 0.9, 'triangle', 0.05, -320); },
  door: () => { tone(110, 0.5, 'square', 0.07, 80); noise(0.4, 0.12, 400); },
  coin: () => { tone(988, 0.06, 'square', 0.06); tone(1319, 0.2, 'square', 0.06, 0, 0.06); },
  letter: () => { tone(160, 0.12, 'square', 0.12, -60); noise(0.08, 0.15, 300); },
};

/* ---- music: tiny two-voice sequencer ---- */
function noteHz(n) {
  if (n === '-') return 0;
  const m = n.match(/^([A-G])(#|b)?(\d)$/);
  const st = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  return 440 * Math.pow(2, (12 * (+m[3] + 1) + st - 69) / 12);
}
const parseSeq = s => s.replace(/\|/g, ' ').trim().split(/\s+/).map(t => { const [n, d] = t.split(':'); return [noteHz(n), +d]; });
const TRACKS = {
  intro: { unit: 60 / 132, lead: ['triangle', 0.07], bass: ['sine', 0.09],
    a: 'A4:2 C5:2 E5:2 D5:2 | C5:2 B4:2 G4:4 | F4:2 A4:2 C5:2 B4:2 | A4:4 E4:4',
    b: 'A2:4 E3:4 | F2:4 G2:4 | D2:4 E2:4 | A2:4 E2:4' },
  lint: { unit: 60 / 210, lead: ['square', 0.028], bass: ['triangle', 0.07],
    a: 'E5:1 G5:1 C6:1 B5:1 A5:2 G5:2 | F5:1 A5:1 G5:1 E5:1 D5:2 -:2 | E5:1 G5:1 C6:1 D6:1 E6:2 C6:1 A5:1 | G5:1 F5:1 E5:1 D5:1 C5:4',
    b: 'C3:2 G3:2 C3:2 G3:2 | F2:2 C3:2 G2:2 D3:2 | A2:2 E3:2 F2:2 C3:2 | G2:2 D3:2 C3:4' },
  battle: { unit: 60 / 300, lead: ['square', 0.03], bass: ['triangle', 0.08],
    a: 'A4:1 A4:1 C5:1 A4:1 E5:1 D5:1 C5:1 B4:1 | A4:1 A4:1 C5:1 E5:1 G5:2 F5:1 E5:1 | D5:1 D5:1 F5:1 D5:1 A5:1 G5:1 F5:1 E5:1 | E5:1 F5:1 E5:1 D5:1 C5:1 B4:1 G#4:2',
    b: 'A2:1 A3:1 A2:1 A3:1 A2:1 A3:1 A2:1 A3:1 | F2:1 F3:1 F2:1 F3:1 F2:1 F3:1 F2:1 F3:1 | D2:1 D3:1 D2:1 D3:1 D2:1 D3:1 D2:1 D3:1 | E2:1 E3:1 E2:1 E3:1 E2:1 E3:1 E2:1 E3:1' },
  boss: { unit: 60 / 330, lead: ['square', 0.032], bass: ['triangle', 0.09],
    a: 'D5:1 F5:1 A5:1 D6:1 C6:2 A5:2 | A#5:1 A5:1 G5:1 F5:1 E5:2 C5:2 | D5:1 F5:1 A5:1 D6:1 E6:2 F6:2 | E6:1 D6:1 C#6:1 A5:1 D6:4',
    b: 'D3:1 D3:1 D4:1 D3:1 A#2:1 A#2:1 A#3:1 A#2:1 | G2:1 G2:1 G3:1 G2:1 A2:1 A2:1 A3:1 A2:1 | D3:1 D3:1 D4:1 D3:1 A#2:1 A#2:1 A#3:1 A#2:1 | A2:1 A2:1 A3:1 A2:1 D3:1 D3:1 D4:2' },
  calm: { unit: 60 / 150, lead: ['triangle', 0.06], bass: ['sine', 0.08],
    a: 'C5:2 E5:2 G5:2 E5:2 | F5:2 A5:2 G5:4 | E5:2 D5:2 C5:2 A4:2 | B4:2 D5:2 C5:4',
    b: 'C3:4 G2:4 | F2:4 C3:4 | A2:4 F2:4 | G2:4 C3:4' },
};
for (const k in TRACKS) { TRACKS[k].va = parseSeq(TRACKS[k].a); TRACKS[k].vb = parseSeq(TRACKS[k].b); }
const music = { cur: null, voices: null, timer: null };
function playMusic(name) {
  if (music.cur === name) return;
  stopMusic(); music.cur = name;
  if (!name || !audio.ctx) return;
  const tr = TRACKS[name], t0 = audio.ctx.currentTime + 0.05;
  music.voices = [{ seq: tr.va, i: 0, t: t0, inst: tr.lead }, { seq: tr.vb, i: 0, t: t0, inst: tr.bass }];
  const tick = () => {
    if (!audio.ctx) return;
    const now = audio.ctx.currentTime;
    for (const v of music.voices) {
      while (v.t < now + 0.25) {
        const [hz, d] = v.seq[v.i]; const dur = d * tr.unit;
        if (hz && !audio.muted) {
          const o = audio.ctx.createOscillator(), g = audio.ctx.createGain();
          o.type = v.inst[0]; o.frequency.value = hz;
          g.gain.setValueAtTime(0.0001, v.t); g.gain.linearRampToValueAtTime(v.inst[1], v.t + 0.01);
          g.gain.setValueAtTime(v.inst[1], v.t + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, v.t + dur * 0.95);
          o.connect(g); g.connect(audio.master); o.start(v.t); o.stop(v.t + dur);
        }
        v.t += dur; v.i = (v.i + 1) % v.seq.length;
      }
    }
  };
  tick(); music.timer = setInterval(tick, 60);
}
function stopMusic() { clearInterval(music.timer); music.timer = null; music.cur = null; }

/* ---------------------------------------------------------------- sprites */
const PAL = {
  k: '#14111c', w: '#ffffff', g: '#c9c4d6', G: '#7a748c', r: '#e8443a', R: '#a02838', y: '#ffd23f', Y: '#c99a1a',
  h: '#f2b07a', q: '#d4824a', Q: '#8f4a26', o: '#f08a24', b: '#5b8def', B: '#2e4a9a', p: '#f7a1c4', P: '#8e62c9',
  n: '#b58d5c', N: '#6e5236', c: '#f3e3c0', C: '#d9b77e', s: '#eef4ff', S: '#9fb8ee', e: '#7cc96a', E: '#3f7a3a',
};
const sym = half => half.map(r => r + [...r].reverse().join(''));
const swap = (rows, m) => rows.map(r => [...r].map(c => m[c] || c).join(''));
const ART = {};
ART.sock = [
  '..kkkkkkkk....', '.kggggggggk...', '.kwwwwwwwwk...', '.krrrrrrrrk...', '.kwwwwwwwwk...', '.krrrrrrrrk...',
  '.kwwwwwwwwk...', '.kwwwwkwkwk...', '.kwwwwkwkwk...', '.kwwwpwwwpk...', '.kwwwwwwwwk...', '.kwwwwwwwwwkk.',
  '.kwwwwwwwwwwwk', '.kGwwwwwwwrrrk', '..kGGwwwwwrrrk', '...kkkkkkkkkk.',
];
ART.sockSleep = ART.sock.map((r, i) => i === 7 ? '.kwwwwwwwwk...' : i === 8 ? '.kwwwGGwGGk...' : r);
ART.sockBlue = swap(ART.sock, { r: 'b', R: 'B' });
ART.sockGreen = swap(ART.sock, { r: 'e', R: 'E' });
ART.moth = sym([
  '..k......', '...k.....', '....k..kk', '.....kkcc', '....kcccc', '...kcSSSS', '...kSkwkS', '...kSkkkS',
  '...kcSSSc', '....kcccc', '....kccck', '...nkcccc', '..nnnkPPc', '.nnoonkPP', 'nnoyonkPP', 'nnoonkPPw',
  '.nnnnkPPP', '..nnnkPPw', '....kPPPP', '....kPPPP', '.....kcck', '.....kk.k',
]);
ART.fort = [
  '......kkkk......', '....kkCCCCkk....', '...kCCcCCCCCk...', '..kCCkCCCCkCCk..', '..kCCkCCCCkCCk..',
  '.kCCCCCCCCCCCCk.', '.kNNkkkkkkkkNNk.', '.kNkwwwwwwwwkNk.', '..kkwGwGGwGwkk..', '....kwwwwwwk....', '.....kkkkkk.....',
];
ART.dummy = sym([
  '.....kk', '....kGG', '.....kG', '..kkkcc', '.kccccc', 'kcccccc', 'kcckccc', 'kcccccc', 'kcrcccc', '.kccccc',
  '..kcccc', '..kcccc', '.kcccrc', '.kccccc', '..kkkkk', '.....kN', '.....kN', '.....kN', '.....kN', '...kkkN', '..kNNNN', '.kk...k',
]);
ART.bunny = sym([
  '...kk...', '..kggk..', '..kgpk..', '..kgpk..', '...kgk..', '..kkgkkk', '.kgggggg', 'kgggkggg', 'kgggkggg',
  'kggggggp', 'kgGggggk', '.kgGgggg', '..kkGGgg', '....kkkk',
]);
ART.cling = sym([
  '...kkkkk', '..ksssss', '.kssssss', '.ksskkss', '.ksskwss', 'ksppssss', 'ksssssks', 'kssssssk', 'kSssssss',
  'kSssssss', 'kSSsssss', 'kSkSSsSs', 'k.kkSkSk', '....k.k.',
]);
ART.penny = sym([
  '......kr', '.....krr', '......kr', '...kkkkk', '..kGgggg', '.kGggggg', 'kqqkkkkk', 'kqqkyyyk', 'kqqkkkkk',
  'kqhqqqqq', 'kqhqqqqq', 'kqqqqqqq', 'kQqqqqqq', '.kQqqqqq', '..kQQqqq', '...kkkkk', '....kGk.', '....kGk.', '...kkGkk',
]);
ART.save = ['..kkkkk..', '.kyyyyyk.', 'kyhyyyyyk', 'kyyYyYyyk', 'kyyyyyyyk', 'kyyYyYyyk', 'kyyyyyyyk', '.kyyyyyk.', '..kkkkk..'];
ART.gummy = ['.rr.rr.', '.rrrrr.', '.rkrkr.', '..rrr..', '.rrrrr.', 'rrrrrrr', '.rrrrr.', '.rr.rr.'];
ART.soul = ['..rrrr..', '..rwwr..', '..rrrr..', '..rrrr..', '..rrrr..', '..rrrrrr', '..rrrrrr', '...rrrr.'];
ART.sign = ['kkkkkkkkkkkk', 'knnnnnnnnnnk', 'knNNNNNNNNnk', 'knnnnnnnnnnk', 'knNNNNNNnnnk', 'knnnnnnnnnnk', 'kkkkkkkkkkkk',
  '.....kNk....', '.....kNk....', '.....kNk....', '....kkNkk...'];
ART.heart = ['.p.p.', 'ppppp', 'ppppp', '.ppp.', '..p..'];
ART.shirt = ['.ee...ee.', 'eeee.eeee', 'eeeeeeeee', '..eeeee..', '..eeeee..', '..eeeee..', '..eeeee..'];
ART.coin = ['.yyyy.', 'yyYYyy', 'yYyyyy', 'yYyyyy', 'yyyyYy', '.yyyy.'];
ART.hat = ['...kkkk...', '..kPPPPk..', '..kPPPPk..', '..kyyyyk..', 'kkPPPPPPkk', 'kPPPPPPPPk', '.kkkkkkkk.'];
ART.tee = ['.kk....kk.', 'kbbk..kbbk', 'kbbbkkbbbk', '.kkbbbbkk.', '..kbbbbk..', '..kbbbbk..', '..kkkkkk..'];
ART.shoe = ['.kkk........', 'kNNNk.......', 'kNyNNkkkk...', 'kNNNNNNNNkk.', 'kNNNNNNNNNNk', 'kwwwwwwwwwwk', '.kkkkkkkkkk.'];

const SPR = {};
for (const name in ART) {
  const rows = ART[name], w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch !== '.' && ch !== ' ') { g.fillStyle = PAL[ch] || '#f0f'; g.fillRect(i, j, 1, 1); } } });
  SPR[name] = c;
}
// white silhouettes for hit flashes
const SPRW = {};
for (const name in SPR) {
  const s = SPR[name], c = document.createElement('canvas'); c.width = s.width; c.height = s.height;
  const g = c.getContext('2d'); g.drawImage(s, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  SPRW[name] = c;
}
function spr(name, x, y, s = 2, flip = false, alpha = 1, g = ctx, white = false) {

function loadRoom(id, x, y) {
  const room = ROOMS[id];
  G.roomId = id; G.room = room;
  G.roomCanvas = renderRoom(room, Object.keys(ROOMS).indexOf(id) + 1);
  G.ents = room.setup ? room.setup() : [];
  G.player.x = x; G.player.y = y;
  nudgeFree(G.player);
  G.particles = G.particles.filter(p => p.keep);
  if (G.scene === 'world') playMusic(room.music);
}
async function gotoRoom(id, x, y) {
  G.transit = true;
  await fadeTo(1, 0.18);
  loadRoom(id, x, y);
  await fadeTo(0, 0.18);
  G.transit = false;
}

function solidAt(x, y) {
  const ch = tileAt(Math.floor(x / T), Math.floor(y / T));
  if (ch === '#' || ch === ' ') return true;
  for (const e of G.ents) {
    if (!e.solid || e.hidden) continue;
    if (x > e.x - e.w / 2 && x < e.x + e.w / 2 && y > e.y - e.h && y < e.y) return true;
  }
  return false;
}
function blocked(x, y) { return solidAt(x - 9, y - 9) || solidAt(x + 9, y - 9) || solidAt(x - 9, y - 1) || solidAt(x + 9, y - 1); }
function nudgeFree(p) {
  if (!blocked(p.x, p.y)) return;
  for (let d = 2; d < 64; d += 2) for (const [ox, oy] of [[0, d], [0, -d], [d, 0], [-d, 0]]) if (!blocked(p.x + ox, p.y + oy)) { p.x += ox; p.y += oy; return; }
}
function movePlayer(mx, my) {
  const p = G.player;
  if (mx && !blocked(p.x + mx, p.y)) p.x += mx;
  if (my && !blocked(p.x, p.y + my)) p.y += my;
}
function updateWorld(dt) {
  const p = G.player;
  for (const e of G.ents) if (e.update) e.update(e, dt);
  if (G.dlg || G.busy || G.menu || G.transit) { p.moving = false; return; }
  if (jp('c')) { openMenu(); return; }
  let dx = 0, dy = 0;
  if (keys.left) dx -= 1; if (keys.right) dx += 1; if (keys.up) dy -= 1; if (keys.down) dy += 1;
  if (dx || dy) {
    if (dx) { p.face = dx < 0 ? 'left' : 'right'; p.flip = dx < 0; } else p.face = dy < 0 ? 'up' : 'down';
    const sp = 140 * dt * ((dx && dy) ? 0.7071 : 1);
    movePlayer(dx * sp, dy * sp);
    p.walkT += dt; p.moving = true;
  } else { p.moving = false; p.walkT = 0; }
  const ex = G.room.exits || {};
  if (p.x < 2 && ex.left) return void gotoRoom(ex.left, W - 14, p.y);
  if (p.x > W - 2 && ex.right) return void gotoRoom(ex.right, 14, p.y);
  if (p.y < 6 && ex.up) return void gotoRoom(ex.up, p.x, H - 8);
  if (p.y > H - 2 && ex.down) return void gotoRoom(ex.down, p.x, 18);
  for (const t of G.room.triggers || []) {
    if ((t.if ? t.if() : true) && p.x > t.x && p.x < t.x + t.w && p.y > t.y && p.y < t.y + t.h) { run(t.fn); return; }
  }
  if (tileAt(Math.floor(p.x / T), Math.floor((p.y - 4) / T)) === 's') { run(zap); return; }
  if (jp('z')) {
    pressed.z = false;
    const f = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[p.face];
    const px = p.x + f[0] * 20, py = p.y - 6 + f[1] * 20;
    const hit = G.ents.find(e => !e.hidden && e.talk && px > e.x - e.w / 2 - 10 && px < e.x + e.w / 2 + 10 && py > e.y - e.h - 26 && py < e.y + 8);
    if (hit) run(() => hit.talk(hit));
  }
}
function drawWorld() {
  ctx.drawImage(G.roomCanvas, 0, 0);
  if (G.room.under) G.room.under();
  const list = G.ents.filter(e => !e.hidden).map(e => ({ y: e.z ?? e.y, f: () => drawEntity(e) }));
  list.push({ y: G.player.y, f: drawPlayer });
  list.sort((a, b) => a.y - b.y).forEach(o => o.f());
  // ambient lint motes
  for (let i = 0; i < 14; i++) {
    const x = (hash(i, 1, 77) * W + G.t * (6 + i % 5) + Math.sin(G.t + i) * 10) % W;
    const y = (hash(i, 2, 77) * H - G.t * (4 + i % 3) * 2 + H * 10) % H;

  if (G.menu) drawMenu();
  drawDialog();
}

function updateMenu() {
  const m = G.menu;
  if (m.lvl === 0) {
    if (jp('up') || jp('down')) { m.sel ^= 1; SFX.select(); }
    if (jp('x') || jp('c')) { G.menu = null; return; }
    if (jp('z')) { if (m.sel === 0 && !G.inv.length) { SFX.buzz(); return; } SFX.confirm(); m.lvl = m.sel === 0 ? 1 : 3; m.isel = 0; }
  } else if (m.lvl === 1) {
    const n = G.inv.length;
    if (jp('up')) { m.isel = (m.isel + n - 1) % n; SFX.select(); }
    if (jp('down')) { m.isel = (m.isel + 1) % n; SFX.select(); }
    if (jp('x')) { m.lvl = 0; return; }
    if (jp('z')) { SFX.confirm(); m.lvl = 2; m.act = 0; }
  } else if (m.lvl === 2) {
    if (jp('left')) { m.act = (m.act + 2) % 3; SFX.select(); }
    if (jp('right')) { m.act = (m.act + 1) % 3; SFX.select(); }
    if (jp('x')) { m.lvl = 1; return; }
    if (jp('z')) {
      pressed.z = false; const idx = m.isel, id = G.inv[idx];
      if (m.act === 0) { const lines = useItem(idx, false); G.menu = null; run(() => say(lines)); }
      else if (m.act === 1) { G.menu = null; run(() => say([ITEMS[id].info])); }
      else {
        if (ITEMS[id].key) { G.menu = null; run(() => say(["* You can't drop that. Mothilda would find out."])); }
        else { G.inv.splice(idx, 1); G.menu = null; run(() => say([pick([`* The ${ITEMS[id].name} was thrown away.`, `* You left the ${ITEMS[id].name} on the floor. The lint will take care of it.`])])); }

const PUZ_ORDER = ['hat', 'tee', 'shoe'];
function setupPuzzle() {
  const solved = G.flags.puzzleSolved;
  const e = [
    signEnt(160, 150, ['* "GET DRESSED, LITTLE SOCK."', '* "TOP TO BOTTOM."', '* (Below that, in smaller letters: "you know what a sock is for. think about it.")']),
    ent({ id: 'gate', x: 608, y: 290, w: 64, h: 70, solid: !solved, shadow: false, open: solved ? 1 : 0, draw: gateDraw }),
  ];
  const icons = ['shoe', 'hat', 'tee'];
  icons.forEach((ic, i) => e.push(ent({ id: 'btn_' + ic, icon: ic, x: 192 + i * 128, y: 352, w: 48, h: 26, solid: false, shadow: false, down: solved, z: 0, draw: plateDraw, update: plateUpdate })));
  if (!solved) e.push(npc('moth', 'moth', 470, 200, { fly: true, flip: true, talk: () => say([{ who: 'moth', text: 'Top to bottom, dear. Like getting dressed.' }, { who: 'moth', text: "I know you don't usually wear the clothes. You ARE the clothes. Use your imagination." }]) }));
  G.puz = solved ? [...PUZ_ORDER] : [];
  return e;
}
function plateDraw(e) {
  const d = e.down ? 4 : 0;
  rect(e.x - 26, e.y - 26, 52, 30, '#14111c');
  rect(e.x - 24, e.y - 24 + d, 48, 24 - d, e.down ? '#7cc96a' : '#e8443a');
  rect(e.x - 24, e.y - 24 + d, 48, 4, e.down ? '#a6e39a' : '#ff7a6e');
  sprC(e.icon, e.x, e.y - 6 + d, 2);
}
function plateUpdate(e) {
  if (G.flags.puzzleSolved || G.busy) return;
  const p = G.player, on = Math.abs(p.x - e.x) < 24 && p.y > e.y - 28 && p.y < e.y + 6;
  if (on && !e.down && !e.lock) {
    e.down = true; e.lock = true; SFX.select();
    G.puz.push(e.icon);
    const okSoFar = G.puz.every((v, i) => v === PUZ_ORDER[i]);
    if (!okSoFar) run(puzzleWrong);
    else if (G.puz.length === 3) run(puzzleSolved);
  }
  if (!on) e.lock = false;
}
async function puzzleWrong() {
  const first = G.puz[0];
  SFX.buzz(); shake(4);
  await wait(0.3);
  G.ents.filter(e => e.icon).forEach(e => e.down = false);
  const n = (G.flags.puzWrong || 0); G.flags.puzWrong = n + 1;
  let lines;
  if (first === 'shoe' && !G.flags.shoeJoke) { G.flags.shoeJoke = true; lines = ['SHOES?! First?!', '...Dear. We do not put the shoe on first. We barely even talk about shoes.', 'They stomp on us, you know. Every day. Sweaty tyrants.']; }
  else lines = [['Not quite! Unless you are going for a "look".'], ["Hmm. That's a hat on your feet, dear."], ['Top to bottom, darling. Head, body, feet.']][n % 3];
  G.puz = [];
  await say(lines.map(t => ({ who: 'moth', text: t })));
}

let B = null;

const BOX_TEXT = { x: 32, y: 250, w: 576, h: 140 };

async function battle(key) {
  const def = ENEMIES[key];
  const p = G.player;
  SFX.encounter(); p.alert = true; await wait(0.55); p.alert = false;
  const prevMusic = G.room.music; stopMusic();
  B = { key, def, hp: def.hp, maxhp: def.hp, flags: {}, turn: 0, state: 'flash', box: { ...BOX_TEXT }, soul: { x: 320, y: 320 },
    bullets: [], menu: { lvl: 0, btn: 0, sel: 0 }, iframes: 0, eshake: 0, alpha: 1, dying: 0, spared: false, anim: null };
  B.say = lines => battleText(lines); B.choose = opts => battleChoice(opts);

  B.flashT = 0; SFX.select(); await wait(0.1); SFX.select(); await wait(0.1); SFX.select(); await wait(0.25);
  B.state = 'menu';
  playMusic(def.music);

    G.flags.seenSoul = true;

async function battleLoop() {
  const def = B.def;
  let flavor = def.intro;
  while (true) {
    const a = await menuSelect(flavor);
    B.lastAct = null;
    if (a.type === 'fight') {
      const acc = await attackBar();
      const dmg = acc <= 0 ? 0 : Math.max(1, Math.round((8 + G.fuz * 2) * (0.35 + 1.65 * acc)) - def.def + Math.floor(Math.random() * 3));
      await slash(dmg);
      if (B.hp <= 0) {
        B.state = 'dying'; SFX.dust();
        await tween(B, { dying: 1 }, 1.4);
        G.exp += def.exp; G.lint += def.lint; G.kills++;
        const lines = [`* YOU WON!\n* You earned ${def.exp} EXP and ${def.lint} LINT.`];
        if (G.exp >= 10 * G.fuz) { G.fuz++; G.maxhp += 4; G.hp += 4; lines.push('* Your FUZ increased.'); }
        await battleText(lines);
        return 'killed';
      }
    } else if (a.type === 'act') {
      const act = def.acts[a.i - 1];
      let lines;
      if (a.i === 0) lines = [def.check];
      else { B.lastAct = act.n; lines = await act.f(B); }
      await battleText(lines);
    } else if (a.type === 'item') {
      await battleText(useItem(a.i, true));
    } else if (a.type === 'spare') {
      if (B.spareable) {
        B.spared = true; SFX.spare(); puff(320, 140, 18, '#ffd23f');
        G.lint += Math.ceil(def.lint / 2); G.spares++;
        await battleText([`* YOU WON!\n* You earned 0 EXP and ${Math.ceil(def.lint / 2)} LINT.`]);
        return 'spared';
      }
      await battleText([`* You tried to spare ${def.name}.`, def.boss ? '* He is not ready to be spared. He is barely ready to be spent.' : '* ...but it isn\'t ready yet.']);
    } else if (a.type === 'flee') {
      if (Math.random() < 0.6) { SFX.select(); B.fleeing = true; await wait(0.5); await battleText(['* You fled.', '* Like a sock in the night.']); return 'fled'; }
      await battleText(['* You tried to flee...', '* ...but your cuff got snagged.']);
    }
    B.spareable = !!def.spareable(B);
    // enemy turn
    const sp = def.speech(B);
    if (sp) await speech(sp);
    const pats = def.patterns(B);
    for (const pn of pats) {
      await dodge(pn);

    }
    B.turn++;
    B.spareable = !!def.spareable(B);
    flavor = def.flavor(B);
  }
}

function updateBattle(dt) {
  if (!B) return;
  B.eshake = Math.max(0, B.eshake - dt);
  if (B.iframes > 0) B.iframes -= dt;
  const m = B.menu;
  switch (B.state) {
    case 'text':
      if (!B.typer.done) { if (jp('x') || jp('z')) B.typer.finish(); else B.typer.update(dt); }
      else if (jp('z')) bResolve();
      break;
    case 'choice': {
      const c = B.choice;
      if (jp('left') || jp('right')) { c.sel ^= 1; SFX.select(); }
      if (jp('z')) { SFX.confirm(); B.choice = null; bResolve(c.sel); }
      break;
    }
    case 'speech':
      if (!B.bubble.done) { if (jp('x') || jp('z')) B.bubble.finish(); else B.bubble.update(dt); }
      else if (jp('z')) { B.bubble = null; bResolve(); }
      break;
    case 'menu': {
      if (m.lvl === 0) {
        if (B.typer && !B.typer.done) B.typer.update(dt);
        if (jp('left')) { m.btn = (m.btn + 3) % 4; SFX.select(); }
        if (jp('right')) { m.btn = (m.btn + 1) % 4; SFX.select(); }
        if (jp('z')) {
          if (m.btn === 2 && !G.inv.length) { SFX.buzz(); break; }
          SFX.confirm(); m.lvl = 1; m.sel = 0;
        }
      } else {
        const list = menuList();
        if (jp('x')) { if (m.lvl === 2) { m.lvl = 1; m.sel = 0; } else m.lvl = 0; SFX.select(); break; }
        const cols = (m.btn === 0 || m.lvl === 1 && m.btn === 1) ? 1 : 2;
        if (jp('up')) { m.sel = Math.max(0, m.sel - cols); SFX.select(); }
        if (jp('down')) { m.sel = Math.min(list.length - 1, m.sel + cols); SFX.select(); }
        if (cols === 2 && jp('left') && m.sel % 2) { m.sel--; SFX.select(); }
        if (cols === 2 && jp('right') && m.sel % 2 === 0 && m.sel + 1 < list.length) { m.sel++; SFX.select(); }
        if (jp('z')) {
          SFX.confirm();
          if (m.btn === 0) bResolve({ type: 'fight' });
          else if (m.btn === 1) { if (m.lvl === 1) { m.lvl = 2; m.sel = 0; } else bResolve({ type: 'act', i: m.sel }); }
          else if (m.btn === 2) bResolve({ type: 'item', i: m.sel });
          else bResolve({ type: m.sel === 0 ? 'spare' : 'flee' });
        }
      }
      break;
    }
    case 'attack': {
      const bar = B.bar;
      if (!bar.stopped) {
        bar.x += dt / 1.5;
        if (jp('z')) { bar.stopped = true; bar.t = 0; const acc = 1 - Math.abs(bar.x - 0.5) * 2; bar.acc = Math.max(0, acc); }
        if (bar.x >= 1) { bar.stopped = true; bar.acc = 0; bar.t = 0; }
      } else { bar.t += dt; if (bar.t > 0.35) bResolve(bar.acc < 0.04 ? 0 : bar.acc); }
      break;
    }
    case 'dodge': {
      const P = B.pat, s = B.soul;
      P.t += dt; P.flash = Math.max(0, P.flash - dt);
      let dx = 0, dy = 0;
      if (keys.left) dx--; if (keys.right) dx++; if (keys.up) dy--; if (keys.down) dy++;
      const sp = 150 * dt; s.x += dx * sp; s.y += dy * sp;
      P.P.update(P, dt);
      s.x = Math.max(B.box.x + 12, Math.min(B.box.x + B.box.w - 12, s.x));
      s.y = Math.max(B.box.y + 12, Math.min(B.box.y + B.box.h - 12, s.y));
      for (const b of B.bullets) {
        b.t += dt; b.vx += b.ax * dt; b.vy += b.ay * dt; b.x += b.vx * dt; b.y += b.vy * dt;

async function gameOver() {
  stopMusic();
  const go = { x: B.soul.x, y: B.soul.y, phase: 0, shards: [], a: 0 };
  G.go = go; G.scene = 'gameover'; G.battle = null;

function drawTumble(t) {

  const items = [['shirt', 5], ['coin', 4], ['gummy', 4], ['sockGreen', 3], ['coin', 3], ['shirt', 4]];

}
function drawFall(t) {

async function introSequence() {

  await narrate('Long ago, two kinds ruled over the laundry hamper: LEFT SOCKS and RIGHT SOCKS.');
  await crossPanel(PANELS.wash);
  await narrate('They washed together. They dried together. They were folded into neat little pairs, as nature intended.');
  await crossPanel(PANELS.dryer);
  await narrate('Then one day... THE DRYER awoke.');
  await crossPanel(PANELS.alone);
  await narrate('With every load, one sock would vanish. Never the pair. Always just one.');
  await crossPanel(PANELS.science);
  await narrate("The world's finest sock scientists studied the mystery for years.");
  await narrate('Their conclusion: "Huh. Weird."');
  const ho = {};
  await crossPanel(PANELS.hamper, { opts: ho });
  await narrate('This is the story of one such sock...');
  await narrate('...who was about to have a VERY bad Tuesday.');
  await narrate('Our hero awakens!');
  await wait(1.0);
  await narrate('...Our hero awakens!!');
  ho.snore = true; SFX.snore(); await wait(0.8); SFX.snore();
  await narrate('............');
  await narrate('Okay. Fine. Have it your way.');
  stopMusic(); G.panelA = 1;
  SFX.slam(); flash('#fff', 1); shake(10); ho.snore = false; ho.awake = true;
  await wait(0.7);
  setPanel(PANELS.lcd); SFX.select(); await wait(0.15); SFX.select(); await wait(0.15); SFX.select();
  await wait(1.6);
  G.tum = { k: 0, whump: 0, word: '', wx: 0, wy: 0 }; setPanel(null, { full: drawTumble });
  for (let i = 0; i < 6; i++) {
    SFX.whump(); shake(9); Object.assign(G.tum, { whump: 0.5, word: pick(['WHUMP', 'WHUMP', 'THOOMP', 'FWUMP']), wx: 150 + Math.random() * 340, wy: 60 + Math.random() * 300 });
    await wait(0.62);
  }
  SFX.slurp(); await tween(G.tum, { k: 1 }, 0.7, ease.in);
  flash('#000', 1); await wait(0.4);
  setPanel(null, { full: drawFall }); SFX.fall();
  await narrate('Somewhere far above, a right sock sighed.');
  await narrate('And our hero fell...');
  await narrate('...and fell...');
  await narrate('...down into the place where all lost things go.');
  await wait(1.0);
  G.tum = null;

}
function updateIntro(dt) {
  if (keys.x) { G.skipHold += dt; if (G.skipHold > 0.8 && !G.skipping) doSkip(); } else G.skipHold = 0;
}
function doSkip() {
  G.skipping = true;
  const ts = G.timers; G.timers = []; ts.forEach(t => t.r());
  const tw = G.tweens; G.tweens = []; tw.forEach(t => { Object.assign(t.o, t.to); t.r(); });
  if (G.dlg) { const r = G.dlg.res; G.dlg = null; r(0); }
}
function drawIntro() {
  rect(0, 0, W, H, '#000');
  const P = G.panel;
  if (P && P.full) P.full(G.t - P.t0);

  text(isTouch ? 'Hold X to skip' : 'Hold X to skip', W - 20, H - 40, 20, '#4a4560', 'right');
}

async function titleCard() {

  rect(0, 0, W, H, '#000');

const NAME_RX = {
  SHOE: [false, "Absolutely not. We don't say that word here."], SHOES: [false, 'Nope. Nope nope nope.'],
  SANS: [false, 'nope.'], DRYER: [false, 'Too soon.'], MOTH: [false, 'That name is taken. And hungry.'],
  MOTHIL: [false, 'That name is taken. And hungry.'], FRISK: [true, 'Wrong game, buddy. ...But okay.'],
  CHARA: [true, 'Wrong game. Also a bit ominous.'], SOCK: [true, 'Very literal. I respect that.'],
  LEFTY: [true, 'A classic.'], RIGHTY: [true, 'Bold.'], PENNY: [true, "You're worth far more than that."],
  LINT: [true, 'You are what you eat. Wait.'], FLUFF: [true, 'Accurate.'], DOBBY: [true, 'Free at last.'],
};
function nameScreen() {
  G.scene = 'name'; G.nameScr = { name: '', sel: 0, confirm: false, csel: 0 };
  playMusic('calm');
}
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
function nameAdd(ch) { const n = G.nameScr; if (n.name.length < 6) { n.name += ch; SFX.select(); } else SFX.buzz(); }
function nameDel() { const n = G.nameScr; n.name = n.name.slice(0, -1); SFX.select(); }
function updateName() {
  const n = G.nameScr;
  if (n.confirm) {
    const rx = NAME_RX[n.name] || [true, 'Is this name correct?'];
    if (!rx[0]) { if (jp('z') || jp('x')) { n.confirm = false; SFX.select(); } return; }
    if (jp('left') || jp('right')) { n.csel ^= 1; SFX.select(); }
    if (jp('x')) { n.confirm = false; return; }
    if (jp('z')) { if (n.csel === 0) { n.confirm = false; SFX.select(); } else { SFX.save(); G.name = n.name; startLanding(); } }
    return;
  }
  const total = LETTERS.length + 2, cols = 7;
  if (jp('left')) { n.sel = (n.sel + total - 1) % total; SFX.select(); }
  if (jp('right')) { n.sel = (n.sel + 1) % total; SFX.select(); }
  if (jp('up')) { n.sel = n.sel >= LETTERS.length ? LETTERS.length - 4 : Math.max(0, n.sel - cols); SFX.select(); }
  if (jp('down')) { n.sel = n.sel + cols >= LETTERS.length ? (n.sel >= LETTERS.length ? n.sel : LETTERS.length + (n.sel % cols < 4 ? 0 : 1)) : n.sel + cols; SFX.select(); }
  if (jp('x')) nameDel();
  if (jp('z')) {
    if (n.sel < LETTERS.length) nameAdd(LETTERS[n.sel]);
    else if (n.sel === LETTERS.length) nameDel();
    else nameDone();
  }
}
function nameDone() { const n = G.nameScr; if (!n.name) { SFX.buzz(); return; } n.confirm = true; n.csel = 0; n.t = G.t; SFX.confirm(); }
function drawName() {
  rect(0, 0, W, H, '#000');
  const n = G.nameScr;
  if (n.confirm) {
    const rx = NAME_RX[n.name] || [true, 'Is this name correct?'];
    const k = Math.min(1, (G.t - n.t) / 2.5);
    const size = 24 + k * 40;
    text(n.name, W / 2 + (Math.random() - 0.5) * 2, 160 - k * 40, size, '#fff', 'center', FONT_UI);
    text(rx[1], W / 2, 280, 32, '#fff', 'center');
    if (rx[0]) ['No', 'Yes'].forEach((s, i) => { text(s, 200 + i * 220, 360, 32, n.csel === i ? '#ffd23f' : '#fff'); if (n.csel === i) spr('soul', 172 + i * 220, 368, 2); });
    else { text('Go back', W / 2, 360, 32, '#ffd23f', 'center'); }

  text('Name the fallen sock.', W / 2, 36, 36, '#fff', 'center');
  text(n.name + (Math.floor(G.t * 2) % 2 ? '_' : ' '), W / 2, 96, 24, '#fff', 'center', FONT_UI);
  LETTERS.forEach((L, i) => {
    const x = 120 + (i % 7) * 66, y = 170 + Math.floor(i / 7) * 46;
    const sel = n.sel === i, wob = sel ? Math.sin(G.t * 10) * 2 : 0;
    text(L, x + wob, y, 20, sel ? '#ffd23f' : '#fff', 'left', FONT_UI);

  text('Backspace', 140, 370, 30, n.sel === LETTERS.length ? '#ffd23f' : '#fff');
  text('Done', 420, 370, 30, n.sel === LETTERS.length + 1 ? '#ffd23f' : '#fff');
  text(isTouch ? 'D-pad to pick a letter, Z to choose' : 'Type a name and press Enter  (or arrows + Space)', W / 2, 430, 22, '#5f5878', 'center');
}

async function startLanding() {

/* ================================================================= MAIN LOOP */
function update(dt) {
  G.t += dt;
  for (let i = G.timers.length - 1; i >= 0; i--) { const t = G.timers[i]; t.t -= dt; if (t.t <= 0) { G.timers.splice(i, 1); t.r(); } }
  for (let i = G.tweens.length - 1; i >= 0; i--) {
    const tw = G.tweens[i]; tw.t += dt; const k = Math.min(1, tw.t / tw.dur), e = tw.e(k);
    for (const key in tw.to) tw.o[key] = tw.from[key] + (tw.to[key] - tw.from[key]) * e;
    if (k >= 1) { G.tweens.splice(i, 1); tw.r(); }
  }
  updateParticles(dt);
  G.shake = Math.max(0, G.shake - dt * 30); G.flash = Math.max(0, G.flash - dt * 2.5);
  if (G.tum) G.tum.whump = Math.max(0, G.tum.whump - dt);
  if (G.toast) { G.toast.t -= dt; if (G.toast.t <= 0) G.toast = null; }
  if (jp('m')) { audio.muted = !audio.muted; if (audio.master) audio.master.gain.value = audio.muted ? 0 : 0.55; toast(audio.muted ? 'SOUND OFF' : 'SOUND ON'); }
  switch (G.scene) {
    case 'boot': updateBoot(); break;
    case 'intro': updateIntro(dt); updateDialog(dt); break;
    case 'title': updateTitle(dt); break;
    case 'name': updateName(); break;
    case 'world': if (!updateDialog(dt) && G.menu && !G.busy) updateMenu(); updateWorld(dt); break;
    case 'battle': updateBattle(dt); break;
    case 'gameover': updateDialog(dt); break;
    case 'ending': updateEnding(dt); break;
  }
  for (const k in pressed) pressed[k] = false;
}
function draw() {
  ctx.save();
  ctx.imageSmoothingEnabled = false;
  if (G.shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * G.shake), Math.round((Math.random() - 0.5) * G.shake));
  switch (G.scene) {
    case 'boot': drawBoot(); break;
    case 'intro': drawIntro(); break;
    case 'title': drawTitle(); break;
    case 'name': drawName(); break;
    case 'world': drawWorld(); break;
    case 'battle': if (B) drawBattle(); break;
    case 'gameover': drawGameOver(); break;
    case 'ending': drawEnding(); break;
  }
  ctx.restore();
  if (G.flash > 0) { ctx.globalAlpha = Math.min(1, G.flash); rect(0, 0, W, H, G.flashCol); ctx.globalAlpha = 1; }
  if (G.fade > 0) { ctx.globalAlpha = G.fade; rect(0, 0, W, H, '#000'); ctx.globalAlpha = 1; }
  if (G.toast) text(G.toast.msg, W - 16, 12, 10, '#7d7697', 'right', FONT_UI);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  try { update(dt); draw(); } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
(document.fonts && document.fonts.load ? Promise.all([document.fonts.load(font(30)), document.fonts.load(font(16, FONT_UI))]).catch(() => {}) : Promise.resolve())
  .then(() => requestAnimationFrame(frame));
