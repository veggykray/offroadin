  <script>
    // Boot guard: if a game file fails to load (for example the folder was opened
    // from inside a ZIP, or the shared alien-strike engine folder is missing) or
    // start-up throws, explain what happened instead of hanging on the loading text.
    (function () {
      var missing = [], firstError = '';
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && t.rel === 'stylesheet'))) missing.push(t.getAttribute('src') || t.getAttribute('href'));
        else if (e instanceof ErrorEvent && !firstError) firstError = e.message || String(e.error);
      }, true);
      window.addEventListener('load', function () {
        setTimeout(function () {
          var boot = document.getElementById('boot');
          if (!boot) return;
          var p = function (html) { return '<p style="margin:0 0 14px">' + html + '</p>'; };
          var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
          var body = missing.length
            ? p('WYRMCROWN could not find its game files (' + missing.length + ' missing, for example <code>' + esc(missing[0]) + '</code>).') +
              p('WYRMCROWN is built on the ALIEN STRIKE engine: keep the <b>wyrmcrown</b> folder next to the <b>alien-strike</b> folder, exactly as they are in the download.') +
              p('If you opened <b>index.html</b> straight from the downloaded ZIP, extract the ZIP first (right-click it, <b>Extract All</b>), then open <b>wyrmcrown/index.html</b> from the extracted folder.')
            : p('WYRMCROWN failed to start: <code>' + esc(firstError || 'start-up did not finish') + '</code>') +
              p('Try a current version of Chrome, Edge or Firefox. If it keeps happening, please report the message above.');
          boot.setAttribute('style', 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d0a08;color:#efe2c6;font:16px/1.5 Georgia,serif;padding:24px;z-index:100');
          boot.innerHTML = '<div style="max-width:640px"><h1 style="margin:0 0 16px;font:700 26px Georgia,serif;letter-spacing:4px;color:#e8b84a">WYRMCROWN</h1>' + body + '</div>';
        }, 1500);
      });
    })();
  </script>
